id: ES:CONCEPT:closed-loop
canonical_name: Closed Loop
concept_type: behavioral-pattern
status: Established
version: 2.10.0
date: 2026-09-28
author: Emmanuel A. Otchere (cardinal author rule, 2026-09-24)
governance: enterprise-semantics
base_concept: WSF:CLOSED_LOOP
authority: WSF
source_decision: ADR-WSF-38 (Baseline, WSF PR #19 MERGED 2026-09-27)
es_integration: ES-ADR-034 + CR-ES-034
supersedes: prior Deprecated stub (2026-09-28, was WSF Closed Loop integration framing)
definition: |
  A Closed Loop is a bounded behavioral cycle in which observations
  of conditions or outcomes are fed back into subsequent
  interpretation, decision, action, or adaptation toward an intended
  objective or outcome.

  Per ES-ADR-034 section 2.
properties:
  - objective
  - observation
  - interpretation
  - decision
  - action
  - outcome
  - feedback
  - adaptation
  - intervention
  - escalation
  - context
