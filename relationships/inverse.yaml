# Authored by: Emmanuel A. Otchere (cardinal author rule, 2026-09-23)
# Filing: VS-B of CR-ES-003 ;;; Value Stream Semantic Grounding ;;; populates the
#         inverse map with 13 inverse pairs matching the 13 governed predicates
#         from CR-ES-003 §9 + §10.
#         Backed by ADR-ES-003 (Proposed, slot 0005).
#
# Inverse predicate map ;;; v0.9.0 ;;; 13 Value Stream inverse pairs + 9 Capability inverse pairs + 11 Agentic inverse pairs + 3 Agentic Value Stream inverse pairs + 2 Agentic Workflow inverse pairs + 2 Agentic Operations inverse pairs + 1 Autonomous Operations inverse pair + 1 Autonomous Value Stream inverse pair + 4 namespaced inverses (capability-realized-through, capability-contributes-to, agent-produces, action-produces) + 1 cross-tranche subject-type namespaced inverse (process-realized-through) for Process->Workflow disambiguation
#
# Per CR-ES-001 §8 and ADR-ES-001 §13, every predicate that has an inverse
# must declare it explicitly here. This file is populated by VS-B with the
# inverse pairs for the 13 Value Stream predicates introduced in
# relationships/vocabulary.yaml v0.2.0.

