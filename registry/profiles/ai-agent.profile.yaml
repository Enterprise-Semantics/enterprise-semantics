canonical_name: AI Agent
version: 1.0.0
status: Established
date: 2026-09-28
author: Emmanuel A. Otchere (cardinal author rule, 2026-09-24)
governance: enterprise-semantics
base_concept: ES:CONCEPT:agent
authority: ES
profile_type: ai-agent
applies_to_concept: ES:CONCEPT:ai-agent
disposition: technology-qualified Agent ;;; implementation specialization profile (ES-037 Disposition Recon)
realization_substrate: ai
canonical_definition: |
    Profile family over Agent with AI as the interpretation/decision/action-selection realization substrate. Per the AI boundary rule, this is implementation technology, not semantic definition.
rationale: |
    Per ES-ADR-037 section 1. Agentic != AI. Agent != AI Agent.
boundary_assertions:
  - profile_not_canonical: true
  - consistent_with_ai_boundary_rule: true
  - four_state_independence_preserved: true
conformance_tests:
  positive:
    - applies_to_canonical_base
    - realization_substrate_not_semantic_identity
    - vendor_neutral_treatment
  negative:
    - canonical_concept_creation_rejected
    - vendor_lock_in_rejected
    - ai_boundary_violation_rejected
    - canonical_ai_term_rejected
disposition_note: |
  This profile family is the canonical place for AI Agent semantics
  per ES-ADR-037 (Dispositon Recon Accepted 2026-09-28). The previous
  ai-agent.concept.yaml was demoted to a Deprecated reference stub
  on 2026-09-28 ;;; AI Agent is a technology-qualified Agent
  realization substrate (interpretation, decision selection, or
  action selection), not a semantic concept in its own right.

  Per ES-ADR-037 section 2: "Agent is the semantic concept. AI Agent
  describes an Agent whose interpretation, decision, action selection,
  or coordination capability is materially implemented through
  artificial intelligence."

  Per ES-ADR-037 section 5: AI Agent SHALL NOT replace or redefine Agent.

