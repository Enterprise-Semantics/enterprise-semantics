    predicate: specializes
    object: external:concept:WSF:CLOSED_LOOP
    status: established
  - subject: ES:CONCEPT:closed-loop
    predicate: distinct-from-workflow
    object: external:concept:workflow
    status: established
  - subject: ES:CONCEPT:closed-loop
    predicate: distinct-from-operations
    object: external:concept:operations
    status: established
agentic_autonomous_independence:
  closed_loop_does_not_imply_autonomous_closed_loop: true
ai_boundary:
  not_required: true
  ai_closed_loop_is_canonical_reject: true
  ai_closed_loop_realized_as_example: true
provenance:
