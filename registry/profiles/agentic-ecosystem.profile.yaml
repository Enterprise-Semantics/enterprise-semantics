# registry/profiles/agentic-ecosystem.profile.yaml ; ES-029 ; 21st profile
id: ES:PROFILE:agentic-ecosystem
canonical_name: Agentic Ecosystem
definition: |
  Profile family for Agentic Ecosystem. Profile type: agentic-ecosystem. Definition populated as part of validator drift remediation Wave B (2026-10-07).
version: 2.5.0
status: Established
date: 2026-09-26
author: Emmanuel A. Otchere (cardinal author rule, 2026-09-24)
governance: enterprise-semantics

base_concept: WSF:ECOSYSTEM
authority: WSF
source_decision: ADR-WSF-28
es_integration: ES-ADR-029 + CR-ES-029

profile_type: agentic-ecosystem
dimension: agentic
applies_to_concept: ES:CONCEPT:agentic-ecosystem

canonical_definitions:
  agentic_ecosystem: |
    An Agentic Ecosystem is an Ecosystem in which material
    interactions, coordination, adaptation, or value-realization
    behavior among participating entities incorporates agentic
    behavior within defined intents, authorities, policies, and
    contextual boundaries.

boundary_assertions:
characteristics:
  - id: ES:CHAR:profile-not-canonical
    label: Profile Not Canonical
    description: |
      Profile flag indicating profile not canonical.
  - id: ES:CHAR:consistent-with-ai-boundary-rule
    label: Consistent With Ai Boundary Rule
    description: |
      Profile flag indicating consistent with ai boundary rule.
  - id: ES:CHAR:four-state-independence-preserved
    label: Four State Independence Preserved
    description: |
      Profile flag indicating four state independence preserved.
characteristics:
  - id: ES:CHAR:agentic-ecosystem-distinct-from-agent
    label: Agentic Ecosystem Distinct From Agent
    description: |
      Profile flag indicating agentic ecosystem distinct from agent.
  - id: ES:CHAR:agentic-ecosystem-distinct-from-agentic-system
    label: Agentic Ecosystem Distinct From Agentic System
    description: |
      Profile flag indicating agentic ecosystem distinct from agentic system.
  - id: ES:CHAR:agentic-ecosystem-distinct-from-agentic-operations
    label: Agentic Ecosystem Distinct From Agentic Operations
    description: |
      Profile flag indicating agentic ecosystem distinct from agentic operations.
  - id: ES:CHAR:agentic-ecosystem-distinct-from-agentic-organization
    label: Agentic Ecosystem Distinct From Agentic Organization
    description: |
      Profile flag indicating agentic ecosystem distinct from agentic organization.
  - id: ES:CHAR:agentic-ecosystem-distinct-from-agentic-enterprise
    label: Agentic Ecosystem Distinct From Agentic Enterprise
    description: |
      Profile flag indicating agentic ecosystem distinct from agentic enterprise.
  - id: ES:CHAR:agentic-ecosystem-does-not-require-ai
    label: Agentic Ecosystem Does Not Require Ai
    description: |
      Profile flag indicating agentic ecosystem does not require ai.
  - id: ES:CHAR:agentic-ecosystem-requires-ecosystem-level-materiality
    label: Agentic Ecosystem Requires Ecosystem Level Materiality
    description: |
      Profile flag indicating agentic ecosystem requires ecosystem level materiality.

conformance_tests:
  positive:
    - foundational_ecosystem_is_canonical
    - agentic_ecosystem_specializes_it
    - agentic_behavior_material_at_ecosystem_level
    - multiple_participating_entities
    - authority_boundaries_representable
    - human_participants_may_remain_active
    - ai_not_required
  negative:
    - ecosystem_merely_containing_ai_rejected
    - ecosystem_merely_containing_agent_rejected
    - ecosystem_merely_using_automation_rejected
    - single_system_behavior_rejected
    - agentic_system_not_agentic_ecosystem
    - agentic_organization_not_agentic_ecosystem

provenance:
  source: [ES-ADR-022, ADR-WSF-28]
  decision: [ES-ADR-029]
  implementation: [CR-ES-029]
