# registry/profiles/agentic-organization.profile.yaml ; Agentic Organization Profile
#
# Per CR-ES-020 section 6 ; profile record for Agentic Organization
# Profile (ES:PROFILE:agentic-organization).
#
# Per CR-ES-020 section 6, the profile shall identify the semantic
# scope of Agentic Organization ; the profile shall NOT imply that
# every scoped concept is a subtype of Organization.
#
# Foundational Dependency Gate (per ADR-ES-020 section 2 + CR-ES-020
# section 2): The profile depends on the parent Organization concept
# being canonical. Per user directive messages 1552900782440058902
# + 1552912455527571546, this profile is established with the
# dependency documented rather than blocked.
#
# Authored by: Emmanuel A. Otchere (cardinal author rule, 2026-09-24)

id: ES:PROFILE:agentic-organization
canonical_name: Agentic Organization Profile
profile_type: agentic-organization
status: candidate
version: 1.0.0
date: 2026-09-25
author: Emmanuel A. Otchere (cardinal author rule, 2026-09-24)
governance: enterprise-semantics
foundational_dependency_gate:
  status: documented  # per ADR-ES-020 section 2 + CR-ES-020 section 2
  parent_concept: external:organization:Organization
  parent_canonical: false  # as of 2026-09-25
  resolution: per user directive messages 1552900782440058902 + 1552912455527571546
  next_foundational_tranche: ADR-ES-021 (Organization canonical grounding)
scope:
  - Organization
  - Agentic Organization
  - Agent
  - Intent
  - Authority
  - Policy
  - Constraint
  - Governance
  - Process
  - Agentic Workflow
  - Agentic Operations
  - Organizational Outcome
  - Organizational Context
  - Capability
  - Value
description: |
  The Agentic Organization Profile aggregates the canonical concepts
  that participate in or support Agentic Organization realization.
  The profile enables discoverability and grouping. It does NOT
  imply that every scoped concept is a subtype of Organization.
scope_assertions:
  - id: AORG-PROF-SCOPE-001
    description: Profile scope is for discoverability, not inheritance.
  - id: AORG-PROF-SCOPE-002
    description: Profile does NOT make Agent a subtype of Organization.
  - id: AORG-PROF-SCOPE-003
    description: Profile does NOT make Process a subtype of Organization.
  - id: AORG-PROF-SCOPE-004
    description: Profile does NOT make Workflow a subtype of Organization.
  - id: AORG-PROF-SCOPE-005
    description: Profile does NOT make Operations a subtype of Organization.
  - id: AORG-PROF-SCOPE-006
    description: Profile does NOT make Capability a subtype of Organization.
materiality_invariants:
  - id: AORG-PROF-MAT-001
    description: Material agentic organizational behavior required per ADR-ES-020 section 3.
  - id: AORG-PROF-MAT-002
    description: AI NOT required per ADR-ES-020 section 9.
  - id: AORG-PROF-MAT-003
    description: Automation NOT sufficient per ADR-ES-020 section 10.
  - id: AORG-PROF-MAT-004
    description: Human participation remains valid per ADR-ES-020 section 11.
boundary_invariants:
  - id: AORG-PROF-BND-001
    description: Agentic Organization is NOT an Agent per AORG-NEG-001.
  - id: AORG-PROF-BND-002
    description: Agentic Organization is NOT Agentic Workflow per AORG-NEG-002.
  - id: AORG-PROF-BND-003
    description: Agentic Organization is NOT Agentic Operations per AORG-NEG-003.
  - id: AORG-PROF-BND-004
    description: Agentic Organization is NOT Agentic Enterprise per AORG-NEG-004.
  - id: AORG-PROF-BND-005
    description: Agentic Organization is NOT Agentic Culture per AORG-NEG-005.
  - id: AORG-PROF-BND-006
    description: Agentic Organization does NOT require AI per AORG-NEG-006.
  - id: AORG-PROF-BND-007
    description: Automation does NOT establish Agentic Organization per AORG-NEG-008.
  - id: AORG-PROF-BND-008
    description: Agentic Organization permits human participation per AORG-CON-014.
  - id: AORG-PROF-BND-009
    description: Agentic Organization has bounded authority per AORG-NEG-011.
  - id: AORG-PROF-BND-010
    description: Agentic Organization does NOT imply Autonomous Organization per AORG-NEG-013.
