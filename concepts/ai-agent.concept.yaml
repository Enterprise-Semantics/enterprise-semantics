id: ES:CONCEPT:ai-agent
canonical_name: AI Agent
definition: |
  An AI Agent is an Entity that bears AI-grounded capabilities, exhibits
  goal-directed behavior under governed policy, makes decisions under varying
  degrees of autonomy, and produces observable evidence of its operation ;;
  all within an enterprise semantic context. Per FND-ES-AG-007 ;; ADR-ES-AG-001 §3.
status: Candidate
version: 0.1.0
concept_type: ai-agent
wsf_grounding:
  - wsf_concept_id: external:wsf:Entity
    relationship: specializes
    note: |
      AI Agent specializes WSF Entity (Tier 1). If WSF adds an Agent concept
      later, the grounding can be tightened.
  - wsf_concept_id: external:wsf:Capability
    relationship: references
    note: AI Agent bears AI-grounded Capabilities (per FND-ES-AG-007 §3.2).
profile_bindings: []
relationships:
  - subject: ES:CONCEPT:ai-agent
    predicate: specializes
    object: ES:CONCEPT:agent
    qualification: ai-bearing-specialization
    status: proposed
    provenance: FND-ES-AG-007 §3.5
    rationale: AI Agent is an AI-bearing specialization of the generic Agent.
  - subject: ES:CONCEPT:ai-agent
    predicate: bears
    object: external:wsf:Capability
    qualification: capability-bearer
    status: proposed
    provenance: FND-ES-AG-007 §3.2
    rationale: AI Agent bears Capabilities (AI-grounded).
  - subject: ES:CONCEPT:ai-agent
    predicate: produces
    object: external:wsf:Event
    qualification: evidence-production
    status: proposed
    provenance: FND-ES-AG-007 §3.3 #5
    rationale: AI Agent produces observable evidence (events).
  - subject: ES:CONCEPT:ai-agent
    predicate: makes
    object: external:concept:decision
    qualification: decision-making-capacity
    status: proposed
    provenance: FND-ES-AG-007 §3.3 #4
    rationale: AI Agent makes decisions under varying degrees of autonomy.
  - subject: ES:CONCEPT:ai-agent
    predicate: distinct-from
    object: external:concept:human-agent
    qualification: ai-bearing-vs-human
    status: proposed
    provenance: FND-ES-AG-007 §3.7
    rationale: AI Agent is AI-bearing ;; Human Agent is human-bearing.
  - subject: ES:CONCEPT:ai-agent
    predicate: grounding-target-for
    object: external:concept:agentic-agent
    qualification: agentic-agent-pending
    status: conditional
    provenance: FND-ES-AG-006 §3
    rationale: |
      AI Agent is the grounding target for any future decision on Agentic
      Agent (per FND-ES-AG-006 scrutiny). The relationship is conditional
      on FND-ES-AG-006 outcome.
  - subject: ES:CONCEPT:ai-agent
    predicate: used-by
    object: ES:CONCEPT:agentic-workflow
    qualification: workflow-bearer
    status: proposed
    provenance: FND-ES-AG-007 §3.6
    rationale: Agentic Workflows use AI Agents.
  - subject: ES:CONCEPT:ai-agent
    predicate: used-by
    object: ES:CONCEPT:agentic-value-stream
    qualification: value-stream-bearer
    status: proposed
    provenance: FND-ES-AG-007 §3.6
    rationale: Agentic Value Streams use AI Agents.
governance: enterprise-semantics
provenance:
  - source: FND-ES-AG-007
    note: AI Agent semantic grounding (10-step template from Grounding Result §13).
  - source: FND-ES-AG-001-Grounding-Result §3 + §12
    note: AI Agent identified as a strong candidate, distinct from Agentic Agent scrutiny.
  - source: ADR-ES-AG-001
    note: Profile pattern does NOT apply to AI Agent (it is Distinct, not a Profile).
  - source: FND-ES-AG-006
    note: AI Agent is the grounding target for any future Agentic Agent decision.
  - source: https://github.com/World-Semantic-Foundation
    note: WSF Entity + WSF Capability grounding inherited.
mappings:
  - authority: wsf
    target_id: external:wsf:Entity
    relationship: specializes
    note: AI Agent specializes WSF Entity.
  - authority: wsf
    target_id: external:wsf:Capability
    relationship: references
    note: AI Agent bears WSF Capability.
