    qualification: agentic-execution-profile
    status: proposed
    provenance: FND-ES-AG-005 ;;; ADR-ES-AG-001 §3
    rationale: Agentic Enterprise is a Profile of Enterprise under agent-augmented operating-model conditions.
  - subject: ES:CONCEPT:agentic-enterprise
    predicate: operates-through
    object: ES:CONCEPT:agentic-operations
    qualification: operating-model-anchored
    status: provisional
    provenance: FND-ES-000 §15 ;;; FND-ES-AG-004
    rationale: Agentic Enterprise operates through Agentic Operations.
  - subject: ES:CONCEPT:agentic-enterprise
