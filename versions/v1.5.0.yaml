# v1.5.0 release pointer ;; Enterprise-Semantics Programme
#
# Authoring CR: CR-ES-016 (Agentic Product Semantic Grounding)
# Ratifying ADR: ADR-ES-016 (Agentic Product Semantic Grounding)
#
# Release scope (per CR-ES-016 §30 + ADR-ES-016 §22):
#   - Canonical schema validation passes
#   - Registry validation passes
#   - Relationship validation passes
#   - Specialization validation passes
#   - Materiality tests pass (CR-ES-016 §27)
#   - AI/automation independence tests pass (CR-ES-016 §10 + §11)
#   - Agentic/Autonomous orthogonality tests pass (CR-ES-016 §9)
#   - Provenance validation passes (CR-ES-016 §28)
#   - Mappings validate (CR-ES-016 §21 + §22)
#   - Documentation and diagrams are synchronized (CR-ES-016 §18 + §19)
#   - Positive conformance tests pass (APROD-CON-001 .. APROD-CON-020)
#   - Negative conformance tests pass (APROD-NEG-001 .. APROD-NEG-016)
#   - No unauthorized foundational concepts are introduced
#   - 20 conformance invariants + 16 negative invariants from CR-ES-016 §23 + §24
#
# Release authority chain:
#   - ADR-ES-016 (Foundational Specialization Decision, Proposed, slot 0018)
#   - CR-ES-016 (Implementation Specification, Proposed, slot 0024)
#
# Architectural continuity (per ADR-ES-016 §31):
#   Capability
#     |__ Agentic Capability
#     |__ Autonomous Capability
#   Product
#     |__ Agentic Product  v1.5.0
#         |__ [Autonomous Product -- future]
#   Service
#     |__ Agentic Service
#     |__ Autonomous Service
#   Value Stream
#     |__ Agentic Value Stream
#     |__ Autonomous Value Stream
#   Enterprise
#     |__ Agentic Enterprise
#     |__ Autonomous Enterprise
#
# Prior releases in the v1.x line:
#   v1.1.0 -- Agentic Capability Semantic Grounding (CR-ES-012)
#   v1.2.0 -- Autonomous Capability Semantic Grounding (CR-ES-013)
#   v1.3.0 -- Agentic Service Semantic Grounding (CR-ES-014)
#   v1.4.0 -- Autonomous Service Semantic Grounding (CR-ES-015)
#   v1.5.0 -- Agentic Product Semantic Grounding (CR-ES-016). This release.
#
# Boundaries preserved:
#   Agentic Product != Agent
#   Agentic Product != Agentic Capability
#   Agentic Product != Agentic Service
#   Agentic Product != Agentic Workflow
#   Agentic Product != Agentic Operations
#   Agentic Product != Agentic Value Stream
#   Agentic Product != Autonomous Product
#   Agentic Product != AI Product
#   Agentic Product != Automated Product
#
# Deferred concepts (per ADR-ES-016 §19 + CR-ES-016 §2):
#   Autonomous Product
#   AI Product
#   Autonomous Product levels
#   Product autonomy maturity
#   Agentic Product maturity
#   Autonomous Offering
#   Agentic Offering
#   Agentic Portfolio
#   Autonomous Portfolio
#   Product Agent
#   Autonomous Agent
#   Agentic Ecosystem
#   Autonomous Ecosystem
#
# Authored by: Emmanuel A. Otchere (cardinal author rule, 2026-09-24)

version: "1.5.0"
release_target: Agentic Product Semantic Grounding
status: candidate  # gated on ADR-ES-016 acceptance
date: 2026-09-25
author: Emmanuel A. Otchere (cardinal author rule, 2026-09-24)
governance:
  authorizing_adr: ADR-ES-016
  implementing_cr: CR-ES-016
  precedence: ES-016 supersedes prior v1.x patches in Agentic Product scope
architectural_continuity:
  capability_branch:
    agentic_capability: v1.1.0
    autonomous_capability: v1.2.0
  product_branch:
    agentic_product: v1.5.0  # this release
    autonomous_product: deferred per ADR-ES-016 §19
  service_branch:
    agentic_service: v1.3.0
    autonomous_service: v1.4.0
  value_stream_branch:
    agentic_value_stream: v0.4.0
    autonomous_value_stream: v0.8.0
  enterprise_branch:
    agentic_enterprise: v1.0.0
    autonomous_enterprise: v1.1.0
semantic_release:
  new_concepts:
    - id: ES:CONCEPT:agentic-product
      semantic_type: AgenticProduct
      version: 1.5.0
      specialization: external:product:Product
  new_profiles:
    - id: ES:PROFILE:agentic-product
      profile_type: agentic-product
      version: 1.5.0
  new_vocabulary_predicates: []  # all required predicates already established
  new_mappings:
    - authority: wsf
      target: external:wsf:Product
      relationship: references
    - authority: opendea
      target: external:opendea:Product
      relationship: references
acceptance_criteria:
  positive_tests: 20  # APROD-CON-001 .. APROD-CON-020
  negative_tests: 16  # APROD-NEG-001 .. APROD-NEG-016
  total: 36
invariants:
  specialization_validity: required
  materiality_validation: required
  ai_independence: required
  automation_independence: required
  human_participation_validity: required
  agentic_autonomous_orthogonality: required
  provenance_completeness: required
  boundary_preservation:
    agentic_product_not_agent: required
    agentic_product_not_agentic_capability: required
    agentic_product_not_agentic_service: required
    agentic_product_not_agentic_workflow: required
    agentic_product_not_agentic_operations: required
    agentic_product_not_agentic_value_stream: required
    agentic_product_not_autonomous_product: required
    agentic_product_not_ai_product: required
    agentic_product_not_automated_product: required
