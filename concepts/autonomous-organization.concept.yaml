  organizational_objective: string
  organizational_scope: string
  autonomy_scope: string
  decision_scope: string
  action_scope: string
  coordination_scope: string
  adaptation_scope: string
  organizational_context: string
  authority_context: string
  policy_context: string
  constraint_context: string
  governance_context: string
  accountability_context: string
  intervention_model: string
