# Architectural position

architectural_position: |
  Per ADR-ES-009 §22 + §25, the canonical semantic architecture:
    STAKEHOLDER VALUE
      Value Stream
        \\-- Agentic Value Stream (CR-ES-005)
        \\-- Autonomous Value Stream (CR-ES-009 ;; THIS RELEASE)
      Value Stage
      OPERATIONAL REALIZATION
      Process
      Workflow / Agentic Workflow
        Agentic Operations (CR-ES-007)
        Autonomous Operations (CR-ES-008) ;; orthogonal to Agentic
      IMPLEMENTATION
      Agent / Human / System / Service

  The diagram expresses possible relationships ;; not mandatory
  containment.

# Core semantic distinction

core_semantic_distinction: |
  Per ADR-ES-009 §3 + §23, the architecture distinguishes:
    Value Stream = end-to-end value-realization journey
    Agentic Value Stream = agentic mode of value realization
    Autonomous Value Stream = independent mode of value realization

  These are related but independent semantic dimensions.

  Permitted combinations:
    Agentic but not Autonomous (e.g. Agentic + human approval)
    Autonomous but not Agentic (e.g. Autonomous rule/control system)
    Both Agentic and Autonomous (e.g. Agentic autonomous value realization)
    Neither Agentic nor Autonomous (e.g. Human-led conventional value stream)

# Grounding

grounding:
  foundation: WSF
  semantic_authority: Enterprise-Semantics
  classification: Tier 2 Specialisation + ES-canonical novelty
  ws_foundation_reference: external:wsf:Value Stream (via Value Stream)
  notes: |
    Per FND-ES-AG-008 §1.3, Value Stream is a WSF Tier 1
    specialisation. Autonomous Value Stream is a Tier 2
    Specialisation, it inherits the Value Stream grounding and
    adds ES-canonical novelty (the 11 characteristics, 15
    properties, 12 canonical relationships, 11 invariants ;; 2
    mapping records).

# Cardinal rules

cardinal_rules:
  - author: Emmanuel A. Otchere
  - d004_dash_rule: 0 forbidden glyphs
  - vendor_specific_embargo: 0 references ;; no vendor-specific material from embargoed sources
  - naming: lowercase kebab-case per ADR-ES-002 §11
  - technology_neutral: no AI vendor ;; no specific framework ;; no LLM ;; per ADR-ES-009 §16
  - orthogonality: Autonomous Value Stream is orthogonal to Agentic Value Stream ;; NOT a specialisation ;; per ADR-ES-009 §8 + §23
  - no_autonomous_value_stage: per ADR-ES-009 §11 + §20, existing Value Stage semantics remain authoritative
  - stakeholder_anchor: per ADR-ES-009 §13, stakeholder value remains the defining semantic anchor

