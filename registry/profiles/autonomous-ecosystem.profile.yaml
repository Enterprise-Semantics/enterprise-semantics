# registry/profiles/autonomous-ecosystem.profile.yaml ; ES-030 ; 22nd profile
id: ES:PROFILE:autonomous-ecosystem
canonical_name: Autonomous Ecosystem
definition: |
  Profile family for Autonomous Ecosystem. Profile type: autonomous-ecosystem. Definition populated as part of validator drift remediation Wave B (2026-10-07).
version: 2.6.0
status: Established
date: 2026-09-27
author: Emmanuel A. Otchere (cardinal author rule, 2026-09-24)
governance: enterprise-semantics

base_concept: WSF:ECOSYSTEM
authority: WSF
source_decision: ADR-WSF-28
es_integration: ES-ADR-030 + CR-ES-030

profile_type: autonomous-ecosystem
dimension: autonomous
applies_to_concept: ES:CONCEPT:autonomous-ecosystem

canonical_definitions:
  autonomous_ecosystem: |
    An Autonomous Ecosystem is an Ecosystem in which coordination,
    adaptation, or value-realization behavior among participating
    entities operates without per-decision human involvement, within
    declared policy boundaries, authority delegations, and escalation
    paths.

boundary_assertions:
characteristics:
  - id: ES:CHAR:profile-not-canonical
    label: Profile Not Canonical
    description: |
      Profile flag indicating profile not canonical.
  - id: ES:CHAR:consistent-with-ai-boundary-rule
    label: Consistent With Ai Boundary Rule
    description: |
      Profile flag indicating consistent with ai boundary rule.
  - id: ES:CHAR:four-state-independence-preserved
    label: Four State Independence Preserved
    description: |
      Profile flag indicating four state independence preserved.
characteristics:
  - id: ES:CHAR:autonomous-ecosystem-distinct-from-autonomous-system
    label: Autonomous Ecosystem Distinct From Autonomous System
    description: |
      Profile flag indicating autonomous ecosystem distinct from autonomous system.
  - id: ES:CHAR:autonomous-ecosystem-distinct-from-autonomous-organization
    label: Autonomous Ecosystem Distinct From Autonomous Organization
    description: |
      Profile flag indicating autonomous ecosystem distinct from autonomous organization.
  - id: ES:CHAR:autonomous-ecosystem-distinct-from-agentic-ecosystem
    label: Autonomous Ecosystem Distinct From Agentic Ecosystem
    description: |
      Profile flag indicating autonomous ecosystem distinct from agentic ecosystem.
  - id: ES:CHAR:autonomous-ecosystem-does-not-require-ai
    label: Autonomous Ecosystem Does Not Require Ai
    description: |
      Profile flag indicating autonomous ecosystem does not require ai.
  - id: ES:CHAR:autonomy-requires-policy-boundaries-and-escalation
    label: Autonomy Requires Policy Boundaries And Escalation
    description: |
      Profile flag indicating autonomy requires policy boundaries and escalation.

conformance_tests:
  positive:
    - foundational_ecosystem_is_canonical
    - autonomous_ecosystem_specializes_it
    - autonomous_behavior_material_at_ecosystem_level
    - policy_boundaries_declared
    - escalation_paths_declared
    - ai_not_required
  negative:
    - ecosystem_merely_containing_automation_rejected
    - ecosystem_merely_containing_autonomous_systems_rejected
    - monitoring_without_autonomous_action_rejected
    - autonomous_system_not_autonomous_ecosystem

provenance:
  source: [ES-ADR-022, ADR-WSF-28]
  decision: [ES-ADR-030]
  implementation: [CR-ES-030]
