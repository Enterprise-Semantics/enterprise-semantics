id: ES:CONCEPT:loop-engineering
canonical_name: Loop Engineering
concept_type: engineering-practice
status: Established
version: 2.9.0
date: 2026-09-28
author: Emmanuel A. Otchere (cardinal author rule, 2026-09-24)
governance: enterprise-semantics
base_concept: null
note_no_specialization: |
  Loop Engineering is an engineering_practice (ES-ADR-033 section 1).
  It is NOT a specialization of System, Process, Workflow, Operation,
  or Loop. It represents an engineering discipline/practice concerned
  with creating and governing feedback-driven behavior.
source_decision: ES-ADR-033
es_integration: ES-ADR-033 + CR-ES-033
definition: |
  Loop Engineering is the disciplined design and continuous
  improvement of sensing, interpretation, decision, action, outcome
  observation, and adaptation loops that enable a system, operation,
  service, process, network, or other bounded context to respond to
  changing conditions and pursue intended outcomes.

  Per ES-ADR-033 section 2.
