properties:
  system_intent: required
  agentic_scope: required
  system_context: required
  delegated_intent: required
  authority_context: required
  policy_context: required
  constraint_context: required
  interpretation_scope: required
  decision_scope: required
  action_selection_scope: required
  coordination_scope: required
  adaptation_scope: required
  intervention_model: required
  escalation_boundary: required
  observation_scope: required
  realization_mode: required

provenance:
  - source: ADR-ES-025 section 1
  - source: CR-ES-025 section 2
  - source: ADR-ES-027 section 1
  - source: CR-ES-027 section 2

cardinal_rules:
  - "Agentic System is a specialization of System (canonical per ADR-ES-027 + CR-ES-027 Accepted)"
  - "Agentic System is NOT Autonomous System (Autonomous System remains deferred per ADR-ES-022 section 13)"
  - "Agentic System is NOT Agent per ADR-ES-025 section 5"
  - "Agentic System is NOT Agentic Workflow per ADR-ES-025 section 6"
  - "Agentic System is NOT Agentic Operations per ADR-ES-025 section 7"
  - "Agentic System is NOT Agentic Service per ADR-ES-025 section 11"
  - "Agentic System is NOT Agentic Organization per ADR-ES-025 section 11"
  - "Agentic System is NOT Agentic Enterprise per ADR-ES-025 section 11"
  - "Agentic System is NOT AI System merely because it uses AI per ADR-ES-025 section 3 + section 11"
  - "Agentic System is NOT Automated System merely because it automates execution per ADR-ES-025 section 3 + section 11"
  - "AI NOT required per ADR-ES-025 section 3"
  - "Automation NOT sufficient per ADR-ES-025 section 3"
  - "Agent presence alone NOT sufficient per ADR-ES-025 section 3"
