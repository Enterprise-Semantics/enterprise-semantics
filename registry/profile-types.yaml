# profile-types.yaml ;; Profile type registry
#
# Each entry declares a named profile_type family.
# Profile records must reference a registered profile_type.
# This file is the source of truth for profile_type identity.
#
# To register a new profile_type:
#   1. Add an entry below with id, canonical_name, definition, governance.
#   2. Open a PR ;; review + accept before merge.
#   3. Profile records can then declare this profile_type.

profile_types:

  - id: autonomous-value-realization
    canonical_name: Autonomous Value Realization
    definition: |
      A profile_type family for the Autonomous Value Realization Profile
      per CR-ES-009 §19 + ADR-ES-009 §16. Aggregates Autonomous Value
      Stream ;; Value Stream ;; Value Stage ;; Authority ;; Autonomous
      Operations ;; Agentic Operations ;; Agentic Workflow for
      discoverability and grouping. Does not imply inheritance.
    governance: enterprise-semantics

  - id: autonomous-operations
    canonical_name: Autonomous Operations
    definition: |
      A profile_type family for the Autonomous Operations Profile per
      CR-ES-008 §18 + ADR-ES-008 §16. Aggregates Autonomous Operations ;;
      Operations ;; Authority ;; Intent ;; Workflow ;; Agentic Workflow
      for discoverability and grouping. Does not imply inheritance.
    governance: enterprise-semantics

  - id: agentic-operations
    canonical_name: Agentic Operations
    definition: |
      A profile_type family for the Agentic Operations Profile per
      CR-ES-007 §16 + ADR-ES-007 §16. Aggregates Agentic Operations ;;
      Agent ;; Agentic ;; Intent ;; Authority ;; and Agentic Workflow
      for discoverability and grouping. Does not imply inheritance.
    governance: enterprise-semantics

  - id: agentic-execution
    canonical_name: Agentic Execution
    definition: |
      A profile_type family for Profiles that apply the four Agentic characteristics
      from ADR-ES-AG-001 §3.3: goal-directed execution under bounded autonomy,
      AI-augmented decision-making, adaptive behavior, and human governance rather
      than human execution.
    governance: enterprise-semantics
    status: Established
    created: 2026-09-02

  - id: autonomous-operation
    canonical_name: Autonomous Operation
    definition: |
      A profile_type family for Profiles that apply stronger autonomy characteristics
      than agentic-execution ;; self-governance, broader self-adaptation, and
      self-execution under policy with optional human governance.
      Reserved for future Autonomous semantic work (per FND-ES-AG-001 §4 Q11).
    governance: enterprise-semantics
    status: Reserved
    created: 2026-09-02

  - id: example-do-not-use
    canonical_name: Example ;; Do Not Use
    definition: |
      Example profile_type ;; exists only to demonstrate registry conventions.
      Do not register Profiles with this profile_type.
    governance: enterprise-semantics
    status: Reserved
    created: 2026-09-02

  - id: agentic-value-realization
    canonical_name: Agentic Value Realization
    definition: |
      A profile_type family for Profiles that group Agentic Value Stream
      specialisations for discoverability. Per CR-ES-005 §14 + ADR-ES-005 §6.
      Provides semantic overlay ;; not an inheritance hierarchy.
    governance: enterprise-semantics
    status: Established
    created: 2026-09-23

  - id: agentic-culture
    canonical_name: Agentic Culture
    definition: |
      A profile_type family for the Agentic Culture Profile per
      CR-ES-023 section 8 + ADR-ES-023 section 12. Aggregates
      Culture ;; Agentic Culture ;; Agentic Organization ;;
      Agentic Operations ;; Agentic Workflow ;; Agent ;;
      Organizational Context ;; Organizational Outcome ;;
      Delegation Practice ;; Authority Practice ;; Accountability
      Practice ;; Collaboration Practice ;; Decision Practice
      for discoverability and grouping. Does not imply inheritance.
    governance: enterprise-semantics

  - id: agentic-enterprise
    canonical_name: Agentic Enterprise
    definition: |
      A profile_type family for Profiles that group Agentic Enterprise
      specialisations for discoverability ;; semantic overlay not
      inheritance ;; per CR-ES-010 §6 + ADR-ES-010 §6. Aggregates
      Agentic Enterprise ;; Enterprise ;; Agent ;; Agentic Value
      Stream ;; Agentic Operations ;; Agentic Workflow ;; Authority ;;
      Intent.
    governance: enterprise-semantics
    status: Proposed
    created: 2026-09-24

  - id: culture
    canonical_name: Culture
    definition: |
      A profile_type family for the Culture Profile per CR-ES-026
      section 4 + ADR-ES-026. Aggregates Culture ;; Entity ;;
      Organization ;; Governance ;; Policy ;; Authority ;;
      Accountability ;; Capability ;; Process ;; Decision ;;
      Adaptation for discoverability and grouping. Does not imply
      inheritance.
    governance: enterprise-semantics

  - id: autonomous-culture
    canonical_name: Autonomous Culture
    definition: |
      A profile_type family for the Autonomous Culture Profile
      per CR-ES-024 section 4 + ADR-ES-024 section 12.
      Aggregates Culture ;; Autonomous Culture ;; Autonomous
      Organization ;; Agentic Organization ;; Autonomous
      Operations ;; Agentic Operations ;; Agent ;; Organizational
      Context ;; Organizational Outcome ;; Delegation Practice ;;
      Authority Practice ;; Accountability Practice ;;
      Intervention Practice ;; Escalation Practice ;; Decision
      Practice ;; Adaptation Practice for discoverability and
      grouping. Does not imply inheritance.
    governance: enterprise-semantics

  - id: system
    canonical_name: System
    definition: |
      A profile_type family for the System Profile per CR-ES-027
      section 4 + ADR-ES-027. Aggregates System ;; Entity ;;
      Element ;; Boundary ;; Context ;; Function ;; Purpose ;;
      Outcome ;; Behavior ;; Capability ;; Service ;; Workflow
      ;; Agent for discoverability and grouping. Does not imply
      inheritance.
    governance: enterprise-semantics

  - id: agentic-system
    canonical_name: Agentic System
    definition: |
      A profile_type family for the Agentic System Profile per
      CR-ES-025 section 5 + ADR-ES-025. Aggregates System ;;
      Agentic System ;; Agent ;; Intent ;; Authority ;; Policy ;;
      Constraint ;; Context ;; Action ;; Outcome ;; Agentic
      Workflow ;; Capability ;; Service ;; Value for
      discoverability and grouping. Does not imply inheritance.
      Autonomous System remains deferred per ADR-ES-022
      section 13.
    governance: enterprise-semantics

