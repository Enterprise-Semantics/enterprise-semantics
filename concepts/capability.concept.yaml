# Capability concept record, per CR-ES-002 §7 template and ADR-ES-002 §1.
#
# Authored by: Emmanuel A. Otchere (cardinal author rule, 2026-09-22)
# Status: Candidate (per scope decision, promotion to Established held for a separate governed action)
# WSF Grounding: Tier 2 Specialisation per FND-ES-AG-008 §1.3, provisional Business-Capability equivalent per WSF pre-declared pattern.
# Identity: ES:CONCEPT:capability, namespace divergence with CR-ES-002 §7 ES:CAPABILITY:... form documented in ADR-ES-002 §2.5.

id: ES:CONCEPT:capability
canonical_name: Capability
status: Candidate
version: 0.2.0
concept_type: capability

definition: |
  An enduring ability of an Entity to achieve or enable an Outcome.
  Capability describes what an Entity is able to achieve or enable,
  rather than the activity through which the achievement occurs.
  Capability therefore represents an enduring potential or competence
  of an Entity that may be exercised through processes, roles, services,
  systems, resources, or other realization mechanisms.

  Per CR-ES-002 §2.1 and ADR-ES-002 §1.1.

semantic_type: capability
domain: enterprise

exclusions:
  - Process
  - Workflow
  - Function
  - Role
  - Resource
  - Service
  - System
  - Outcome
  - Value
  - Goal
  - Skill
  - Activity

wsf_grounding:
  - wsf_concept_id: external:wsf:Capability
    relationship: specializes
    note: |
      Capability specialises WSF Capability (Tier 2). Per FND-ES-AG-008
      §1.3, this is the Tier 2 Specialisation pattern. WSF pre-declares
      Business / Operational / Technical / Organisational / Digital
      Capability sub-kinds. ES capability is the Business-Capability
      equivalent (provisional, ADR-ES-002 §1.5 confirms).

profile_bindings: []

relationships:
  - subject: ES:CONCEPT:capability
    predicate: enables
    object_type: Outcome
    qualification: outcome-enablement
    status: established
    provenance: CR-ES-002 §4 + §5.2
    rationale: |
      A Capability enables an Outcome when possession or exercise of the
      Capability makes the Outcome achievable. The relationship does not
      assert that the Capability alone produces the Outcome.

  - subject: ES:CONCEPT:capability
    predicate: realized-through
    object_type: Process
    qualification: capability-realisation
    status: established
    provenance: CR-ES-002 §4 + §5.3
    rationale: |
      A Capability is realized-through a Process when execution of the
      Process exercises or manifests the Capability. This relationship
      establishes the critical Capability-Process boundary, a
      Capability must not be defined as a collection of Processes.

  - subject: ES:CONCEPT:capability
    predicate: exercised-by
    object_type: Role
    qualification: role-exercise
    status: established
    provenance: CR-ES-002 §4 + §5.4
    rationale: |
      A Role exercises a Capability when the Role is responsible for
      applying or performing the ability represented by the Capability
      within a defined context.

  - subject: ES:CONCEPT:capability
    predicate: supported-by
    object_type: Resource
    qualification: resource-support
    status: established
    provenance: CR-ES-002 §4 + §5.5
    rationale: |
      A Resource supports a Capability when the Resource provides
      something required for the Capability to be exercised or sustained.

  - subject: ES:CONCEPT:capability
    predicate: delivered-through
    object_type: Service
    qualification: service-delivery
    status: established
    provenance: CR-ES-002 §4 + §5.6
    rationale: |
      A Service exposes or delivers a Capability to a consumer. The
      relationship shall not imply that Capability and Service are
      synonymous.

  - subject: ES:CONCEPT:capability
    predicate: implemented-by
    object_type: System
    qualification: system-implementation
    status: established
    provenance: CR-ES-002 §4 + §5.7
    rationale: |
      A System provides the mechanisms required for the Capability to
      exist or operate within a a defined context. This relationship is
      intentionally broader than software implementation.

  - subject: ES:CONCEPT:capability
    predicate: contributes-to
    object_type: Value
    qualification: value-contribution
    status: established
    provenance: CR-ES-002 §4 + §5.8
    rationale: |
      A Capability provides a causal or enabling contribution to value
      realisation. contributes-to does not imply direct, exclusive, or
      quantifiable causation.

  - subject: ES:CONCEPT:capability
    predicate: supports
    object_type: Goal
    qualification: goal-support
    status: established
    provenance: CR-ES-002 §4
    rationale: |
      A Capability supports achievement of a Goal.

  - subject: external:concept:entity
    predicate: possesses
    object_type: ES:CONCEPT:capability
    qualification: entity-possession
    status: established
    provenance: CR-ES-002 §4 + §5.1
    rationale: |
      An Entity has the enduring ability represented by that Capability.
      This is the primary anchoring relationship for Capability.

  - subject: ES:CONCEPT:capability
    predicate: bearer-agnostic
    object_type: ES:CONCEPT:capability-bearer
    qualification: bearer-agnosticism
    status: proposed
    provenance: FND-ES-AG-001-Grounding-Result §7
    rationale: |
      Capabilities may be realized by human agents, AI agents, software,
      or composites. Preserved from prior version.

  - subject: ES:CONCEPT:capability
    predicate: realizes
    object_type: ES:CONCEPT:outcome
    qualification: outcome-realization
    status: proposed
    provenance: FND-ES-AG-001-Grounding-Result §7
    rationale: |
      Capabilities realize outcomes. Preserved from prior version.

  - subject: ES:CONCEPT:capability
    predicate: substrate-of
    object_type: ES:CONCEPT:value-stream
    qualification: capability-substrate
    status: proposed
    provenance: FND-ES-AG-001-Grounding-Result §7, FND-ES-AG-002 cross-ref
    rationale: |
      Value Streams are enabled by Capabilities. Preserved from prior version.

governance: enterprise-semantics

provenance:
  - source: CR-ES-002
    note: Capability Semantic Grounding, establishes canonical definition, boundaries, relationships, identity, grounding, mappings, conformance tests.
  - source: ADR-ES-002
    note: Capability Semantic Grounding Decision, ratifies CR-ES-002 as the governed semantic decision.
  - source: FND-ES-AG-001-Grounding-Result §7
    note: WSF Tier 2 grounding (Capability as specialisation of Disposition derived from Capacity + Ability).
  - source: FND-ES-AG-008 §1.3
    note: Per-concept WSF ↔ ES classification, ES capability is Tier 2 Specialisation, provisional Business-Capability equivalent.
  - source: WSF live Tier 2 (Capability)
    note: WSF pre-declares Business/Operational/Technical/Organisational/Digital Capability sub-kinds.

mappings:
  - authority: wsf
    target_id: external:wsf:Capability
    relationship: specializes
    mapping_type: specialization
    note: |
      Per FND-ES-AG-008 §1.3, Tier 2 Specialisation. ES capability is the
      Business-Capability equivalent (provisional).
  - authority: opendea
    target_id: external:opendea:Capability
    relationship: maps-to
    mapping_type: correspondence
    note: |
      Per CR-ES-002 §16, OpenDEA may represent Capability as an
      architecture construct. Mapping only, no metamodel modification.
  - authority: dea-catalogs
    target_id: external:catalog:Capability
    relationship: instantiated-by
    mapping_type: instantiation
    note: |
      Per CR-ES-002 §17, catalog entries instantiate or classify
      Capability without redefining foundational meaning.

identity:
  primary_id: ES:CONCEPT:capability
  external_ids: []
  namespace_divergence_note: |
    CR-ES-002 §7 example uses ES:CAPABILITY:<K> (4-segment, UPPERCASE).
    Existing concept record uses ES:CONCEPT:capability (3-segment, lowercase).
    Per ADR-ES-002 §2.5, this divergence is permitted, future
    housekeeping CR can migrate identifiers.

