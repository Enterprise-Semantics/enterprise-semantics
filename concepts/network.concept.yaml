# concepts/network.concept.yaml ; ES-034 ; base WSF:NETWORK
id: ES:CONCEPT:network
canonical_name: Network
concept_type: foundational-reference
status: Established
version: 2.7.0
date: 2026-09-27
author: Emmanuel A. Otchere (cardinal author rule, 2026-09-24)
governance: enterprise-semantics
base_concept: WSF:NETWORK
authority: WSF
source_decision: ADR-WSF-37 (Baseline, WSF PR #19 MERGED 2026-09-27)
es_integration: ES-ADR-034 + CR-ES-034
definition: |
  A Network is a structural topology of interconnected entities, nodes,
  and links whose identity is defined by the connection structure.
  Per ADR-WSF-37 section 2. Network has connection-identity distinct
  from System (bounded-identity) and Ecosystem (context-sharing-emergent).
properties:
  - nodes
  - links
  - topology
  - identity_by_structure
relationships:
  - subject: ES:CONCEPT:network
    predicate: specializes
    object: external:concept:WSF:NETWORK
    status: established
  - subject: ES:CONCEPT:network
    predicate: structural-property-of
    object: external:concept:WSF:SYSTEM
    status: established
  - subject: ES:CONCEPT:network
    predicate: topology-distinct-from
    object: external:concept:WSF:ECOSYSTEM
    status: established
agentic_autonomous_independence:
  network_does_not_imply_agentic_network: true
ai_boundary:
  not_required: true
provenance:
  source: [ADR-WSF-37]
  decision: [ES-ADR-034]
  implementation: [CR-ES-034]