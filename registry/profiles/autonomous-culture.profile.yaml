# registry/profiles/autonomous-culture.profile.yaml ; Autonomous Culture Profile
#
# Per CR-ES-024 section 4 ; profile record for Autonomous Culture
# Profile (ES:PROFILE:AUTONOMOUS_CULTURE).
#
# The profile shall NOT imply inheritance from AGENTIC_CULTURE.
#
# Authored by: Emmanuel A. Otchere (cardinal author rule, 2026-09-24)

id: ES:PROFILE:AUTONOMOUS_CULTURE
canonical_name: Autonomous Culture Profile
profile_type: autonomous-culture
status: established
version: 2.1.0
date: 2026-09-25
author: Emmanuel A. Otchere (cardinal author rule, 2026-09-24)
governance: enterprise-semantics

scope:
  - Culture
  - Autonomous Culture
  - Autonomous Organization
  - Agentic Organization
  - Autonomous Operations
  - Agentic Operations
  - Agent
  - Organizational Context
  - Organizational Outcome
  - Delegation Practice
  - Authority Practice
  - Accountability Practice
  - Intervention Practice
  - Escalation Practice
  - Decision Practice
  - Adaptation Practice

description: |
  The Autonomous Culture Profile aggregates the canonical concepts
  that participate in or support Autonomous Culture realization.
  The profile enables discoverability and grouping. It does NOT
  imply that every scoped concept is a subtype of Culture.

scope_assertions:
  - id: ACULT-AUTO-PROF-SCOPE-001
    description: Profile scope is for discoverability, not inheritance.
  - id: ACULT-AUTO-PROF-SCOPE-002
    description: Profile does NOT make Agent a subtype of Culture.
  - id: ACULT-AUTO-PROF-SCOPE-003
    description: Profile does NOT make Delegation Practice a subtype of Culture.
  - id: ACULT-AUTO-PROF-SCOPE-004
    description: Profile does NOT make Authority Practice a subtype of Culture.

materiality_invariants:
  - id: ACULT-AUTO-PROF-MAT-001
    description: Material cultural autonomy required per ADR-ES-024 section 3.
  - id: ACULT-AUTO-PROF-MAT-002
    description: AI NOT required per ADR-ES-024 section 6.
  - id: ACULT-AUTO-PROF-MAT-003
    description: Automation NOT sufficient per ADR-ES-024 section 6.
  - id: ACULT-AUTO-PROF-MAT-004
    description: Autonomous components alone NOT sufficient per ADR-ES-024 section 3.

orthogonality_invariants:
