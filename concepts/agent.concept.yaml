id: ES:CONCEPT:agent
canonical_name: Agent
definition: |
  An Agent is an Entity that acts on behalf of another Entity to pursue
  stated outcomes. Agents may be human, software, AI-bearing, or composite.
  Agents exhibit goal-directed behavior and bear capabilities that can be
  invoked, observed, and governed. The generic Agent concept is intentionally
  bearer-agnostic ;; it does NOT require AI grounding. Per FND-ES-AG-007 §3.1.
status: Candidate
version: 0.1.0
concept_type: agent
