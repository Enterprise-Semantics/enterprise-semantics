# concepts/closed-loop.concept.yaml ; ES-035 ; base WSF:CLOSED_LOOP
id: ES:CONCEPT:closed-loop
canonical_name: Closed Loop
concept_type: foundational-reference
status: Established
version: 2.8.0
date: 2026-09-27
author: Emmanuel A. Otchere (cardinal author rule, 2026-09-24)
governance: enterprise-semantics
