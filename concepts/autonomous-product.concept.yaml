# concepts/autonomous-product.concept.yaml ;; Autonomous Product (ES:CONCEPT:autonomous-product) ;; per CR-ES-017 §2 + ADR-ES-017 §1
#
# Per CR-ES-017 §2 + ADR-ES-017 §1:
#   An Autonomous Product is a Product whose realization,
#   interaction, configuration, fulfillment, or adaptation is
#   capable of progressing through defined decisions, actions,
#   coordination, and adaptation within specified product
#   objectives, authority, policies, constraints, and governance
#   boundaries without requiring human intervention for every
#   product decision or action.
#
# Specialisation of Product (not replacement ;; not parallel
# construct). Per CR-ES-017 §2, the Autonomous Product schema
# shall preserve the mandatory Product semantics.
#
# Per ADR-ES-017 §14 + CR-ES-017 §2, this record does NOT establish
# Autonomous Offering, Product autonomy maturity, autonomy levels,
# Autonomous Portfolio, Autonomous Agent, Autonomous Product Agent,
# Autonomous Ecosystem. Those concepts are explicitly deferred to
# separate governance decisions.
#
# Per ADR-ES-017 §5 + §9 + §10 + CR-ES-017 §8, the implementation
# shall reject Autonomous Product -> Agentic Product, Autonomous
# Service, Autonomous Capability, Autonomous Workflow, Autonomous
# Operations, Autonomous Value Stream, Autonomous Enterprise, or
# AI Product inheritance. AI is NOT required, automation is NOT
# sufficient, human participation remains compatible with autonomy.
#
# Authored by: Emmanuel A. Otchere (cardinal author rule, 2026-09-24)

id: ES:CONCEPT:autonomous-product
canonical_name: Autonomous Product
definition: |
  A Product whose realization, interaction, configuration,
  fulfillment, or adaptation is capable of progressing through
  defined decisions, actions, coordination, and adaptation within
  specified product objectives, authority, policies, constraints,
  and governance boundaries without requiring human intervention
  for every product decision or action.
  The Product concept remains the universal foundational type per
  ADR-ES-002 ; Autonomous Product is a contextual specialization,
  not a replacement or narrowing of Product. Autonomy must be
  material to product realization ; AI, automation, Agent
  participation, autonomous system usage, machine learning, event-
  driven execution, software, or APIs alone do not establish
  Autonomous Product.
status: Candidate
version: 1.6.0
concept_type: autonomous-product
specializes:
  - canonical_id: external:product:Product
    relationship: specialization-of
    rationale: |
      Autonomous Product is a contextual specialization of the
      universal Product concept. The semantic distinction remains:
      Product describes something intentionally offered to a
      stakeholder or consumer for the realization of intended value ;
      Autonomous Product additionally describes how that product can
      be realized with bounded independent progression within
      product objectives, authority, policies, constraints, and
      governance boundaries.
wsf_grounding:
  - wsf_concept_id: external:wsf:Product
    relationship: references
    note: |
      Autonomous Product inherits the WSF Product grounding via its
      parent Product concept.
