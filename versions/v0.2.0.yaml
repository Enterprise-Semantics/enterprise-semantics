#   - the Value Stream relationship vocabulary
#
# This version does NOT imply:
#   - mature Value Stream catalogs
#   - Agentic Value Stream support
#   - Autonomous Value Stream support
#   - complete value-management semantics
#   - WSF + OpenDEA + DEA Catalog mappings (held for VS-C)

