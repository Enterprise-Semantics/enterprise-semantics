# concepts/autonomous-closed-loop.concept.yaml, Autonomous Closed Loop, and ES-035
#
# Per ES-ADR-035 + CR-ES-035.
# semantic_kind: behavioral_pattern_specialization of ES-034 (Closed Loop behavioral_pattern).
# Status: Established.

id: ES:CONCEPT:autonomous-closed-loop
canonical_name: Autonomous Closed Loop
concept_type: behavioral-pattern-specialization
status: Established
version: 2.11.0
date: 2026-09-28
author: Emmanuel A. Otchere (cardinal author rule, 2026-09-24)
governance: enterprise-semantics
base_concept: ES:CONCEPT:closed-loop
source_decision: ES-ADR-035
es_integration: ES-ADR-035 + CR-ES-035
definition: |
  An Autonomous Closed Loop is a Closed Loop capable of independently
  progressing through observation, interpretation, decision, action,
  outcome evaluation, and adaptation toward defined objectives within
  specified authority, policies, constraints, and governance boundaries,
  without requiring human intervention for every loop decision or action.

  Per ES-ADR-035 section 2.
properties:
  - objective
  - autonomy_scope
  - decision_scope
  - action_scope
  - adaptation_scope
  - authority_context
  - policy_context
  - constraint_context
  - governance_context
  - intervention_model
  - escalation_boundary
  - observation_scope
  - feedback_scope
  - outcome_scope
relationships:
  - subject: ES:CONCEPT:autonomous-closed-loop
    predicate: specializes
    object: external:concept:closed-loop
    status: established
    provenance: ES-ADR-035 section 3
  - subject: ES:CONCEPT:autonomous-closed-loop
    predicate: pursues
    object: external:concept:objective
    status: established
    provenance: ES-ADR-035 section 9
  - subject: ES:CONCEPT:autonomous-closed-loop
    predicate: operates-within
