# versions/v0.8.0.yaml, Autonomous Value Stream semantic establishment
#
# Per CR-ES-009 §32 + ADR-ES-009 §25.
# This version indicates semantic establishment of the Autonomous
# Value Stream ;; a specialisation of Value Stream. Per CR-ES-009 §35
# the release adds:
#
#   * CR-ES-009 introduces the autonomous-value-realization Autonomous Value
#     Stream specialisation ;; the value-realization counterpart to
#     Autonomous Operations (CR-ES-008)
#   * autonomy becomes an orthogonal semantic dimension at the value-
#     realization layer ;; not just at the operations layer
#   * partial and distributed autonomy allowed ;; not every stage must
#     be autonomous
#   * stakeholder-value anchor preserved

id: ES:VERSION:v0.8.0
canonical_name: v0.8.0
status: Candidate
date: 2026-09-23

# Release summary

release_summary: |
  Semantic establishment of the Autonomous Value Stream concept ;; a
  specialisation of Value Stream ;; with 12 canonical relationships, 
  15 properties, 11 characteristics, 11 invariants, and 2
  mappings to WSF + OpenDEA. The release adds:
    - 1 concept record (ES:CONCEPT:autonomous-value-stream)
    - 1 governed predicate (contains)
    - 1 inverse pair
    - 1 ES:PROFILE:autonomous-value-realization (per CR-ES-009 §19)
    - 1 profile_type registration (autonomous-value-realization)
    - 2 mapping records (WSF + OpenDEA)
    - 19 conformance rules (AVS-AUTO-CON-001..019)
    - 12 negative tests
    - 6-field autonomy integrity test
    - documentation + PlantUML visuals + OTCHERE Inc example

