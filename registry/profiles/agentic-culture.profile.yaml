description: |
  The Agentic Culture Profile aggregates the canonical concepts
  that participate in or support Agentic Culture realization.
  The profile enables discoverability and grouping. It does NOT
  imply that every scoped concept is a subtype of Culture.

scope_assertions:
  - id: ACULT-PROF-SCOPE-001
    description: Profile scope is for discoverability, not inheritance.
  - id: ACULT-PROF-SCOPE-002
    description: Profile does NOT make Agent a subtype of Culture.
  - id: ACULT-PROF-SCOPE-003
    description: Profile does NOT make Delegation Practice a subtype of Culture.
