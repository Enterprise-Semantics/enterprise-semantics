agentic_autonomous_independence:
  autonomous_closed_loop_does_not_imply_agentic_closed_loop: true
  agentic_closed_loop_does_not_imply_autonomous_closed_loop: true
  four_state_characterization:
    - conventional
    - agentic_closed_loop_deferred
    - autonomous_closed_loop
    - agentic_autonomous_closed_loop_deferred
ai_boundary:
  autonomous_closed_loop_requires_ai: false
  implementation_modes:
