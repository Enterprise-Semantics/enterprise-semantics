id: ES:CONCEPT:agentic-enterprise
canonical_name: Agentic Enterprise
definition: |
  An Agentic Enterprise is an Enterprise whose operating model systematically
  incorporates agent-augmented decision-making, adaptive operating configuration,
  goal-directed execution under bounded autonomy, and human governance rather
  than human execution ;;; across its Strategy, Governance, Capability, Value
  Creation, Operations, Decision, Work, and Culture. Per FND-ES-AG-005 ;;;
  ADR-ES-AG-001 §3.3.
status: Candidate
version: 0.1.0
concept_type: agentic-enterprise
wsf_grounding:
  - wsf_concept_id: external:wsf:Entity
    relationship: references
    note: |
      Agentic Enterprise inherits the WSF Entity grounding via its profiled
      Enterprise. The Profile does not introduce a new semantic kind.
profile_bindings:
  - profile_id: ES:PROFILE:agentic-execution
    profile_type: agentic-execution
    active: true
relationships:
