# concepts/autonomous-culture.concept.yaml ; Autonomous Culture Specialization
#
# Per CR-ES-024 section 2 + ADR-ES-024 section 1. Autonomous Culture
# specializes Culture (canonical per ADR-ES-026 + CR-ES-026 Accepted).
#
# Authored by: Emmanuel A. Otchere (cardinal author rule, 2026-09-24)

id: ES:CONCEPT:autonomous-culture
canonical_name: Autonomous Culture
definition: |
  A Culture in which organizational norms, values, practices,
  and expectations materially support independent decision-making,
  delegated action, adaptive behavior, and reduced reliance on
  human intervention within defined objectives, authority,
  policies, constraints, accountability, and governance boundaries.
concept_type: autonomous-culture
status: Candidate
version: 2.2.0
date: 2026-09-25
author: Emmanuel A. Otchere (cardinal author rule, 2026-09-24)
governance: enterprise-semantics

specializes:
  - ES:CONCEPT:culture

