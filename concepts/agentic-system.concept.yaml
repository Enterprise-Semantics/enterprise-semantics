# concepts/agentic-system.concept.yaml ; Agentic System Specialization
#
# Per CR-ES-025 section 2 + ADR-ES-025 section 1. Agentic System
# specializes System (canonical per ADR-ES-027 + CR-ES-027
# Accepted).
#
# Authored by: Emmanuel A. Otchere (cardinal author rule, 2026-09-24)

id: ES:CONCEPT:agentic-system
canonical_name: Agentic System
definition: |
  A System in which material system behavior incorporates
  the interpretation of delegated intent, contextual decision
  selection, action coordination, adaptation, or execution
  toward an intended outcome within defined authority, policy,
  and contextual boundaries.
concept_type: agentic-system
status: Candidate
version: 2.3.0
date: 2026-09-25
author: Emmanuel A. Otchere (cardinal author rule, 2026-09-24)
governance: enterprise-semantics

specializes:
  - ES:CONCEPT:system

relationships:
  - subject: ES:CONCEPT:agentic-system
    predicate: engages
    object: ES:CONCEPT:agent
    qualification: system-agent-engagement
    status: established
    provenance: ADR-ES-025 section 10 + CR-ES-025 section 6
  - subject: ES:CONCEPT:agentic-system
    predicate: interprets
    object: ES:CONCEPT:intent
    qualification: intent-interpretation
    status: established
    provenance: ADR-ES-025 section 10 + CR-ES-025 section 6
  - subject: ES:CONCEPT:agentic-system
    predicate: operates-within
    object: external:system:Authority
    qualification: authority-operation
    status: established
    provenance: ADR-ES-025 section 10 + CR-ES-025 section 6
  - subject: ES:CONCEPT:agentic-system
    predicate: governed-by
    object: external:policy:Policy
    qualification: policy-governance
    status: established
    provenance: ADR-ES-025 section 10 + CR-ES-025 section 6
  - subject: ES:CONCEPT:agentic-system
    predicate: constrained-by
    object: external:constraint:Constraint
    qualification: constraint-operation
    status: established
    provenance: ADR-ES-025 section 10 + CR-ES-025 section 6
  - subject: ES:CONCEPT:agentic-system
    predicate: responds-to
    object: external:system:Context
    qualification: contextual-response
    status: established
    provenance: ADR-ES-025 section 10 + CR-ES-025 section 6
  - subject: ES:CONCEPT:agentic-system
    predicate: selects
    object: ES:CONCEPT:action
    qualification: action-selection
    status: established
    provenance: ADR-ES-025 section 10 + CR-ES-025 section 6
  - subject: ES:CONCEPT:agentic-system
    predicate: coordinates
    object: ES:CONCEPT:action
    qualification: action-coordination
    status: established
    provenance: ADR-ES-025 section 10 + CR-ES-025 section 6
  - subject: ES:CONCEPT:agentic-system
    predicate: produces
    object: external:system:Outcome
    qualification: outcome-production
    status: established
    provenance: ADR-ES-025 section 10 + CR-ES-025 section 6
  - subject: ES:CONCEPT:agentic-system
    predicate: adapts-to
    object: external:system:Context
    qualification: contextual-adaptation
    status: established
    provenance: ADR-ES-025 section 10 + CR-ES-025 section 6
  - subject: ES:CONCEPT:agentic-system
    predicate: uses
    object: ES:CONCEPT:agentic-workflow
    qualification: workflow-use
    status: established
    provenance: ADR-ES-025 section 10 + CR-ES-025 section 6
  - subject: ES:CONCEPT:agentic-system
    predicate: supports
    object: ES:CONCEPT:capability
    qualification: capability-support
    status: established
    provenance: ADR-ES-025 section 10 + CR-ES-025 section 6
  - subject: ES:CONCEPT:agentic-system
    predicate: implements
    object: external:service:Service
    qualification: service-implementation
    status: established
    provenance: ADR-ES-025 section 10 + CR-ES-025 section 6
  - subject: ES:CONCEPT:agentic-system
    predicate: contributes-to
    object: external:system:Value
    qualification: value-contribution
    status: established
