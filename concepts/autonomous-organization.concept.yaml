    profile_type: autonomous-organization
    binding_role: specializing-profile
    status: established
    per: CR-ES-021 section 9  # populated by VS-D2c after profile record is authored

autonomy_orthogonality:
  - id: AORG-AUTO-ORTH-001
    description: Agentic Organization is NOT Autonomous Organization (orthogonal dimensions per ADR-ES-021 section 3 + section 8)
  - id: AORG-AUTO-ORTH-002
    description: Autonomous Organization is NOT Agentic Organization (orthogonal dimensions per ADR-ES-021 section 3 + section 8)
  - id: AORG-AUTO-ORTH-003
    description: An Organization may be both Agentic and Autonomous per ADR-ES-021 section 8 four-state model

autonomy_materiality:
  - id: AORG-AUTO-MAT-001
    description: Material organizational autonomy required per ADR-ES-021 section 5
  - id: AORG-AUTO-MAT-002
    description: AI NOT required per ADR-ES-021 section 11 + CR-ES-021 section 7
  - id: AORG-AUTO-MAT-003
    description: Automation NOT sufficient per ADR-ES-021 section 11 + CR-ES-021 section 7
  - id: AORG-AUTO-MAT-004
    description: Autonomous components alone NOT sufficient per ADR-ES-021 section 5

boundary_invariants:
