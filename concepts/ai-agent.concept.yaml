id: ES:CONCEPT:ai-agent
canonical_name: AI Agent (deprecated reference)
concept_type: profile-reference-stub
status: Deprecated
version: 0.1.0-stub
date: 2026-09-28
author: Emmanuel A. Otchere (cardinal author rule, 2026-09-24)
governance: enterprise-semantics

definition: |
  Historical reference stub, the canonical AI Agent concept has
  been demoted per ES-ADR-037 (AI Agent Semantic Disposition Recon,
  Accepted 2026-09-28). AI Agent is realized as the ai-agent profile
  family over ES:CONCEPT:agent with AI as the realization substrate
  for interpretation, decision selection, or action selection.
  The historical grounding (FND-ES-AG-007 §3) is preserved below as
  a reference record.

base_concept: ES:CONCEPT:agent
authority: ES
disposition: profile (canonical-reject per ES-ADR-037 disposition recon)
disposition_date: 2026-09-28

# Historical content preserved as a reference record. The full canonical
# definition has moved to ES-ADR-037 + the ai-agent profile family.

historical_grounding_reference: |
  AI Agent (historical FND-ES-AG-007 concept record) was an Entity that
  bears AI-grounded capabilities, exhibits goal-directed behavior under
  governed policy, makes decisions under varying degrees of autonomy, and
  produces observable evidence of its operation, all within an enterprise
  semantic context.

  Per ES-ADR-037 section 2, the canonical concept is replaced by the
  ai-agent profile family over ES:CONCEPT:agent. AI Agent is the
  technology-qualified specialization of Agent where AI is the realization
  substrate for interpretation, decision selection, or action selection.

# Critical boundary tests per ES-ADR-037 section 4
critical_tests:
  Agent_without_AI: Valid
  AI_without_Agent_behavior: Valid
  AI_Agent_without_autonomy: Valid
  AI_Agent_with_autonomy: Valid
  Agentic_Agent_without_AI: Valid
  Autonomous_Agent_without_AI: Valid
  AI_Agent_Agentic: Valid
  AI_Agent_Autonomous: Valid
  AI_Agent_Agentic_Autonomous: Valid

# ES-022 orthogonality preserved per ES-ADR-037 section 4
agentic_autonomous_independence:
  ai_agent_does_not_imply_agentic: true
  ai_agent_does_not_imply_autonomous: true
  agentic_equals_ai: false
  autonomous_equals_ai: false

ai_boundary:
  ai_agent_is_realization_substrate_not_semantic_identity: true
  ai_equals_agentic: false
  ai_equals_autonomous: false
  automated_agent_equals_ai_agent: false

note: |
  This concept record is a reference stub. The full canonical disposition
  is established by ES-ADR-037 (Dispositon Recon Accepted 2026-09-28) and
  the ai-agent profile family (registry/profiles/ai-agent.profile.yaml).
  No new AI Agent canonical concept is introduced. AI Agent is realized
  as a profile over ES:CONCEPT:agent with AI as the realization substrate.

