# concepts/agentic-product.concept.yaml ;; Agentic Product (ES:CONCEPT:agentic-product) ;; per CR-ES-016 §3 + ADR-ES-016 §1
#
# Per CR-ES-016 §3 + ADR-ES-016 §1:
#   An Agentic Product is a Product whose material realization,
#   interaction, configuration, adaptation, or fulfillment incorporates
#   agentic behavior in interpreting intent, selecting or coordinating
#   actions, or adapting product behavior toward an intended outcome
#   within defined authority, policy, and contextual boundaries.
#
# Specialisation of Product (not replacement ;; not parallel construct).
# Per CR-ES-016 §3, the Agentic Product schema shall preserve the
# mandatory Product semantics.
#
# Per ADR-ES-016 §19 + CR-ES-016 §2, this record does NOT establish
# Autonomous Product, AI Product, Product maturity, Product autonomy
# levels, Autonomous Offering, Agentic Offering, Agentic Portfolio,
# Autonomous Portfolio, Product Agent, Autonomous Agent, Agentic
# Ecosystem, Autonomous Ecosystem. Those concepts are explicitly deferred
# to separate governance decisions.
#
# Per ADR-ES-016 §20 + §31 + CR-ES-016 §26, the implementation shall
# reject Agentic Product -> Agent, Agentic Capability, Agentic Service,
# Agentic Workflow, Agentic Operations, Agentic Value Stream, or
# Autonomous Product inheritance. AI is NOT required, automation is
# NOT sufficient, human participation remains valid.
#
# Authored by: Emmanuel A. Otchere (cardinal author rule, 2026-09-24)

id: ES:CONCEPT:agentic-product
canonical_name: Agentic Product
definition: |
  A Product whose material realization, interaction, configuration,
  adaptation, or fulfillment incorporates agentic behavior in
  interpreting intent, selecting or coordinating actions, or adapting
  product behavior toward an intended outcome within defined authority,
  policy, and contextual boundaries.
  The Product concept remains the universal foundational type per
  ADR-ES-002 ; Agentic Product is a contextual specialization, not a
  replacement or narrowing of Product. Agentic behavior must be material
  to product realization ; AI, automation, Agent participation, machine
  learning, API usage, conversational interaction, recommendation
  functionality, or dynamic software behavior alone do not establish
  Agentic Product.
status: Candidate
version: 1.5.0
concept_type: agentic-product
specializes:
  - canonical_id: external:product:Product
    relationship: specialization-of
    rationale: |
      Agentic Product is a contextual specialization of the
      universal Product concept. The semantic distinction remains:
      Product describes something intentionally offered to a
      stakeholder or consumer for the realization of intended value ;
      Agentic Product additionally describes how that product is
      realized through material agentic behavior within defined
      authority, policy, and contextual boundaries.
wsf_grounding:
  - wsf_concept_id: external:wsf:Product
    relationship: references
    note: |
      Agentic Product inherits the WSF Product grounding via its
      parent Product concept.
