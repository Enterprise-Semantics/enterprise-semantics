    status: established
    provenance: ES-ADR-033 section 5 ; ES-ADR-034 section 9
  - subject: ES:CONCEPT:closed-loop
    predicate: improved-by
    object: external:concept:loop-engineering
    status: established
    provenance: ES-ADR-033 section 5 ; ES-ADR-034 section 9
agentic_autonomous_independence:
  closed_loop_does_not_imply_agentic: true
  closed_loop_does_not_imply_autonomous: true
  four_state_characterization:
    - conventional
    - agentic_closed_loop_deferred
    - autonomous_closed_loop_per_ES-035
    - agentic_autonomous_closed_loop_deferred
ai_boundary:
  closed_loop_requires_ai: false
  ai_closed_loop_is_canonical_reject: true
  ai_closed_loop_realized_as_example: true
cross_context_instantiation:
  - Process
  - Workflow
  - Service
  - System
  - Operations
  - Network
  - Ecosystem
  - Enterprise
semantic_kind_note: |
  Closed Loop is a behavioral_pattern (per ES-ADR-034 section 1).
  It is not a WSF-level specialization nor a subclass of Process.
  It is a behavioral pattern instantiable across Process, Workflow,
  Service, System, Operations, Network, Ecosystem, Enterprise.
