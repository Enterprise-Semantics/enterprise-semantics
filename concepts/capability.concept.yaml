id: ES:CONCEPT:capability
canonical_name: Capability
definition: |
  A Capability is an enterprise's ability to realize outcomes through
  coordinated resources, processes, and competencies. Capabilities are
  bearer-agnostic ;; they may be realized by human agents, AI agents,
  software systems, or composites. Per FND-ES-AG-001-Grounding-Result §7 ;;
  WSF Capability (Tier 2).
