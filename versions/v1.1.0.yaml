release_summary: |
  Semantic establishment of the Agentic Capability concept , a
  contextual specialization of Capability , with 15 canonical
  relationships , 8 reused governed predicates , 16 provenance entries ,
  18 conformance invariants (ACAP-CON-001..018) , 14 negative tests
  (ACAP-NEG-001..014) , and 2 mappings to WSF + OpenDEA.

