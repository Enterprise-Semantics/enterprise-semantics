# Authored by: Emmanuel A. Otchere (cardinal author rule, 2026-09-23)
# Filing: VS-B of CR-ES-003 ;;; Value Stream Semantic Grounding ;;; populates the
#         vocabulary with 13 governed predicates from CR-ES-003 §9 + §10.
#         Backed by ADR-ES-003 (Proposed, slot 0005).
#
# Vocabulary predicate map ;;; v1.0.0 ;;; 13 Value Stream predicates + 9 Capability predicates + 11 Agentic predicates + 3 Agentic Value Stream predicates + 2 Agentic Workflow predicates + 2 Agentic Operations predicates + 1 Autonomous Operations predicate + 1 Autonomous Value Stream predicate + 4 namespaced predicates + 1 cross-tranche namespaced predicate + 2 Enterprise-subject namespaced predicates (enterprise-realizes-through, enterprise-operates-through) per CR-ES-010 §4
#
# Per CR-ES-001 §8 and ADR-ES-001 §13, relationships are first-class semantic
# content with governed predicates. The vocabulary file is the authoritative
# registry of predicates that may appear in concept YAMLs.
#
# No predicate shall be invented outside an approved ADR/CR or explicitly
# authorised seed activity. The 13 predicates below were introduced by
# CR-ES-003 §9 + §10 and ratified by ADR-ES-003 (Proposed). Subsequent
# tranches have added 9 Capability predicates (CR-ES-002) ;;; 11 Agentic
# predicates (CR-ES-004) ;;; 3 Agentic Value Stream predicates (CR-ES-005) ;;;
# 2 Agentic Workflow predicates (CR-ES-006) ;;; 2 Agentic Operations
# predicates (CR-ES-007) ;;; 1 Autonomous Operations predicate (CR-ES-008) ;;;
# 1 Autonomous Value Stream predicate (CR-ES-009) ;;; 4 namespaced predicates
# (capability-realized-through ;; capability-contributes-to ;; agent-produces
# ;; action-produces) ;;; 1 cross-tranche subject-type namespaced predicate
# (process-realized-through) ;; AND ;;; in this tranche ;;; 2
# Enterprise-subject namespaced predicates (enterprise-realizes-through ;;
# enterprise-operates-through) per CR-ES-010 §4 + ADR-ES-010 §5 + §15.
#
# Per ADR-ES-002 §22, semantic-kind decisions (incl. new predicates) must be
# made through the Finding / ADR / CR process. CR-ES-003 is the carrier for
# the Value Stream predicate set.

vocabulary:
  version: 1.0.0
  status: candidate ;;; awaiting ADR-ES-002 + ADR-ES-003 + ADR-ES-004 acceptance
  governed_predicates:

    # ===== Value Stream ;;; Subject predicates (CR-ES-003 §9 + §10.1-§10.7) =====

    - id: ES:REL:realizes
      canonical_name: realizes
      inverse: realized-by
      subject_type: ES:CONCEPT:value-stream
      object_type: external:concept:stakeholder-value
      definition: |
        A Value Stream realizes Stakeholder Value when progression through the
        Value Stream results in the intended stakeholder value being achieved
        or made available. This is the primary Value Stream relationship.
      lifecycle_status: established
      provenance: CR-ES-003 §10.1 + ADR-ES-003 §10

    - id: ES:REL:contains
      canonical_name: contains
      inverse: belongs-to
      subject_type: ES:CONCEPT:value-stream
      object_type: ES:CONCEPT:value-stage
      definition: |
        A Value Stream contains a Value Stage when that stage forms part of
        the defined progression of value realization.
      lifecycle_status: established
      provenance: CR-ES-003 §10.2 + ADR-ES-003 §20

    - id: ES:REL:enabled-by
      canonical_name: enabled-by
      inverse: enables
      subject_type: ES:CONCEPT:value-stream
      object_type: ES:CONCEPT:capability
      definition: |
        A Value Stream is enabled by a Capability when that Capability provides
        an ability required for one or more stages of the Value Stream to be
        realized.
      lifecycle_status: established
      provenance: CR-ES-003 §10.3 + ADR-ES-003 §9

    - id: ES:REL:realized-through
      canonical_name: realized-through
      inverse: realizes
      subject_type: ES:CONCEPT:value-stream
      object_type: external:concept:process
      definition: |
        A Value Stream is realized through a Process when Process execution
        contributes to the realization of one or more stages of the Value
        Stream. This relationship must NOT imply Value Stream = Process.
        The architectural boundary is preserved.
      lifecycle_status: established
      provenance: CR-ES-003 §10.4 + ADR-ES-003 §8 + §16

    - id: ES:REL:produces
      canonical_name: produces
      inverse: produced-by
      subject_type: ES:CONCEPT:value-stream
      object_type: external:concept:outcome
      definition: |
        A Value Stream produces an Outcome when progression through the Value
        Stream results in the specified outcome.
      lifecycle_status: established
      provenance: CR-ES-003 §10.5 + ADR-ES-003 §11

    - id: ES:REL:uses
      canonical_name: uses
      inverse: used-by
      subject_type: ES:CONCEPT:value-stream
      object_type: external:concept:service
      definition: |
        A Value Stream uses a Service when the Service provides functionality,
        interaction, or value-enabling means required by the Value Stream.
        Value Stream != Service.
      lifecycle_status: established
      provenance: CR-ES-003 §10.6 + ADR-ES-003 §17

    - id: ES:REL:involves
      canonical_name: involves
      inverse: involved-in
      subject_type: ES:CONCEPT:value-stream
      object_type: external:concept:organization
      definition: |
        A Value Stream involves an Organization when the Organization
        participates in, enables, or contributes to one or more stages of the
        Value Stream. The Organization boundary is a participation boundary,
        not a Value Stream boundary.
      lifecycle_status: established
      provenance: CR-ES-003 §10.7 + ADR-ES-003 §19

    - id: ES:REL:uses-resource
      canonical_name: uses-resource
      inverse: used-by-resource
      subject_type: ES:CONCEPT:value-stream
      object_type: external:concept:resource
      definition: |
        A Value Stream uses a Resource when the Resource provides means
        required by the Value Stream. Disambiguated from `uses` which
        applies to Services ;;; per CR-ES-003 §9 relationship table which
        lists two `uses` rows (Service and Resource).
      lifecycle_status: established
      provenance: CR-ES-003 §9 (relationship table) + ADR-ES-003 §20

    # ===== Capability ;;; Subject predicates (CR-ES-002 §4 + §5.2-§5.8 + ADR-ES-002 §1.4) =====

    - id: ES:REL:enables
      canonical_name: enables
      inverse: enabled-by
      subject_type: ES:CONCEPT:capability
      object_type: external:concept:outcome
      definition: |
        A Capability enables an Outcome when possession or exercise of
        the Capability makes the Outcome achievable. The relationship
        does not assert that the Capability alone produces the Outcome.
      lifecycle_status: established
      provenance: CR-ES-002 §4 + §5.2 + ADR-ES-002 §1.4

    - id: ES:REL:capability-realized-through
      canonical_name: realized-through
      inverse: realizes
      subject_type: ES:CONCEPT:capability
      object_type: external:concept:process
      definition: |
        A Capability is realized-through a Process when execution of the
        Process exercises or manifests the Capability. This relationship
        establishes the critical Capability-Process boundary ;;; the
        predicate is namespaced (capability-realized-through) to
        disambiguate from the Value Stream subject variant
        (subject_type: ES:CONCEPT:value-stream) in CR-ES-003 §10.4.
      lifecycle_status: established
      provenance: CR-ES-002 §4 + §5.3 + ADR-ES-002 §1.4

    - id: ES:REL:exercised-by
      canonical_name: exercised-by
      inverse: exercises
      subject_type: ES:CONCEPT:capability
      object_type: external:concept:role
      definition: |
        A Role exercises a Capability when the Role is responsible for
        applying or performing the ability represented by the Capability
        within a defined context.
      lifecycle_status: established
      provenance: CR-ES-002 §4 + §5.4 + ADR-ES-002 §1.4

    - id: ES:REL:supported-by
      canonical_name: supported-by
      inverse: supports
      subject_type: ES:CONCEPT:capability
      object_type: external:concept:resource
      definition: |
        A Resource supports a Capability when the Resource provides
        something required for the Capability to be exercised or sustained.
      lifecycle_status: established
      provenance: CR-ES-002 §4 + §5.5 + ADR-ES-002 §1.4

    - id: ES:REL:delivered-through
      canonical_name: delivered-through
      inverse: delivers
      subject_type: ES:CONCEPT:capability
      object_type: external:concept:service
      definition: |
        A Service exposes or delivers a Capability to a consumer. The
        relationship shall not imply that Capability and Service are
        synonymous.
      lifecycle_status: established
      provenance: CR-ES-002 §4 + §5.6 + ADR-ES-002 §1.4

    - id: ES:REL:implemented-by
      canonical_name: implemented-by
      inverse: implements
      subject_type: ES:CONCEPT:capability
      object_type: external:concept:system
      definition: |
        A System provides the mechanisms required for the Capability to
        exist or operate within a defined context. This relationship is
        intentionally broader than software implementation.
      lifecycle_status: established
      provenance: CR-ES-002 §4 + §5.7 + ADR-ES-002 §1.4

    - id: ES:REL:capability-contributes-to
      canonical_name: contributes-to
      inverse: contributed-to-by
      subject_type: ES:CONCEPT:capability
      object_type: external:concept:value
      definition: |
        A Capability provides a causal or enabling contribution to value
        realisation. contributes-to does not imply direct, exclusive, or
        quantifiable causation. The predicate is namespaced
        (capability-contributes-to) to disambiguate from the Value Stream
        subject variant (subject_type: ES:CONCEPT:value-stream) and the
        Value Stage subject variant (subject_type: ES:CONCEPT:value-stage)
        in CR-ES-003 §9 table.
      lifecycle_status: established
      provenance: CR-ES-002 §4 + §5.8 + ADR-ES-002 §1.4

    - id: ES:REL:supports
      canonical_name: supports
      inverse: supported-by
      subject_type: ES:CONCEPT:role
      object_type: ES:CONCEPT:capability
      definition: |
        A Role supports a Capability when the Role provides enabling
        support to the Capability (e.g., governance, oversight, funding,
        resourcing). This is distinct from "exercised-by" which marks
        direct exercise of the Capability.
      lifecycle_status: established
      provenance: CR-ES-002 §4 + §5.9 + ADR-ES-002 §1.4

    - id: ES:REL:possesses
      canonical_name: possesses
      inverse: possessed-by
      subject_type: ES:CONCEPT:entity
      object_type: ES:CONCEPT:capability
      definition: |
        An Entity possesses a Capability when the Capability is associated
        with the Entity (per CR-ES-002 §5.1 + ADR-ES-002 §1.1). The
        relationship does not assert exercise ;;; only possession or
        association.
      lifecycle_status: established
      provenance: CR-ES-002 §4 + §5.1 + ADR-ES-002 §1.1

    # ===== Agent ;;; Subject predicates (CR-ES-004 §10 + ADR-ES-004 §14) =====

    - id: ES:REL:interprets
      canonical_name: interprets
      inverse: interpreted-by
      subject_type: ES:CONCEPT:agent
      object_type: ES:CONCEPT:intent
      definition: |
          An Agent interprets an Intent when the Agent determines the
          meaning, direction, or purpose of the Intent in the context
          of the Agent's bounded authority. Per ADR-ES-004 §14 ;
          the primary Agent relationship.
      lifecycle_status: established
      provenance: CR-ES-004 §10 + ADR-ES-004 §14

    - id: ES:REL:pursues
      canonical_name: pursues
      inverse: pursued-by
      subject_type: ES:CONCEPT:agent
      object_type: external:concept:goal
      definition: |
          An Agent pursues a Goal when the Agent's actions are directed
          toward the achievement of a specific Goal within bounded
          authority.
      lifecycle_status: established
      provenance: CR-ES-004 §10 + ADR-ES-004 §14

    - id: ES:REL:acts-within
      canonical_name: acts-within
      inverse: governs
      subject_type: ES:CONCEPT:agent
      object_type: ES:CONCEPT:authority
      definition: |
          An Agent acts-within Authority when the Agent's actions are
          constrained by a defined scope of permitted action, decision
          boundaries, resource limits, and escalation conditions. Per
          ADR-ES-004 §15 ;;; Authority is required for agentic
          operation.
      lifecycle_status: established
      provenance: CR-ES-004 §10 + ADR-ES-004 §14 + §15

    - id: ES:REL:selects
      canonical_name: selects
      inverse: selected-by
      subject_type: ES:CONCEPT:agent
      object_type: ES:CONCEPT:action
      definition: |
          An Agent selects an Action when the Agent chooses among
          possible actions within its bounded authority. The selection
          is context-sensitive ;;; per ADR-ES-004 §17 this is the
          agentic-decision pattern (distinct from Instruction).
      lifecycle_status: established
      provenance: CR-ES-004 §10 + ADR-ES-004 §14 + §17

    - id: ES:REL:coordinates
      canonical_name: coordinates
      inverse: coordinated-by
      subject_type: ES:CONCEPT:agent
      object_type: ES:CONCEPT:action
      definition: |
          An Agent coordinates an Action when the Agent sequences,
          orders, or otherwise composes multiple Actions into a
          coherent execution pattern within bounded authority.
      lifecycle_status: established
      provenance: CR-ES-004 §10 + ADR-ES-004 §14

    - id: ES:REL:agent-produces
      canonical_name: produces
      inverse: produced-by
      subject_type: ES:CONCEPT:agent
      object_type: external:concept:outcome
      definition: |
          An Agent produces an Outcome when the Agent's actions result
          in the intended or achieved state. The predicate is namespaced
          (agent-produces) to disambiguate from the Value Stream subject
          variant (subject_type: ES:CONCEPT:value-stream per CR-ES-003
          §10.5) and the Action subject variant (subject_type:
          ES:CONCEPT:action per CR-ES-004 §10).
      lifecycle_status: established
      provenance: CR-ES-004 §10 + ADR-ES-004 §14

    - id: ES:REL:adapts-to
      canonical_name: adapts-to
      inverse: adapted-by
      subject_type: ES:CONCEPT:agent
      object_type: external:concept:context
      definition: |
          An Agent adapts-to Context when the Agent alters its execution
          path in response to changing conditions, observations, or
          intermediate outcomes. Adaptation is characteristic of agentic
          operation but is not by itself sufficient to establish
          agentic semantics (per ADR-ES-004 §7.6).
      lifecycle_status: established
      provenance: CR-ES-004 §10 + ADR-ES-004 §7.6

    - id: ES:REL:receives
      canonical_name: receives
      inverse: received-by
      subject_type: ES:CONCEPT:agent
      object_type: ES:CONCEPT:intent
      definition: |
          An Agent receives an Intent when the Intent is delegated to
          the Agent. The receipt establishes the Agent's interpretive
          obligation but not the Outcome obligation ;;; Action Selection
          and Outcome production are separate predicates.
      lifecycle_status: established
      provenance: CR-ES-004 §10 + ADR-ES-004 §14

    # ===== Intent ;;; Subject predicate (CR-ES-004 §10 + ADR-ES-004 §14) =====

    - id: ES:REL:guides
      canonical_name: guides
      inverse: guided-by
      subject_type: ES:CONCEPT:intent
      object_type: ES:CONCEPT:action
      definition: |
          Intent guides Action when the Action is directed toward the
          Intent's communicated desired direction or purpose. Guidance
          is distinct from prescription (an Instruction prescribes an
          Action ;;; Intent may inform multiple Actions).
      lifecycle_status: established
      provenance: CR-ES-004 §10 + ADR-ES-004 §14

    # ===== Authority ;;; Subject predicate (CR-ES-004 §10 + ADR-ES-004 §14 + §15) =====

    - id: ES:REL:constrains
      canonical_name: constrains
      inverse: constrained-by
      subject_type: ES:CONCEPT:authority
      object_type: ES:CONCEPT:action
      definition: |
          Authority constrains Action when the Action is limited by the
          defined scope of permitted action, decision boundaries,
          resource boundaries, escalation conditions, or constraints.
          Per ADR-ES-004 §15 ;;; Authority may include permitted
          actions, prohibited actions, resource limits, decision
          thresholds, escalation requirements, policy constraints, human
          approval requirements.
      lifecycle_status: established
      provenance: CR-ES-004 §10 + ADR-ES-004 §14 + §15

    # ===== Action ;;; Subject predicate (CR-ES-004 §10 + ADR-ES-004 §14) =====

    - id: ES:REL:action-produces
      canonical_name: produces
      inverse: produced-by
      subject_type: ES:CONCEPT:action
      object_type: external:concept:outcome
      definition: |
          Action produces an Outcome when the Action results in the
          intended or achieved state. Per CR-ES-004 §9 ;;; Action is
          performed toward an intended result. The predicate is
          namespaced (action-produces) to disambiguate from the Agent
          subject variant (subject_type: ES:CONCEPT:agent per CR-ES-004
          §10) and the Value Stream subject variant (subject_type:
          ES:CONCEPT:value-stream per CR-ES-003 §10.5).
      lifecycle_status: established
      provenance: CR-ES-004 §10 + ADR-ES-004 §14

    # ===== Value Stage ;;; Stage-level predicates (CR-ES-003 §9 + §10.8-§10.11) =====

    - id: ES:REL:precedes
      canonical_name: precedes
      inverse: follows
      subject_type: ES:CONCEPT:value-stage
      object_type: ES:CONCEPT:value-stage
      definition: |
        A Value Stage precedes another Value Stage when it occurs earlier in
        the defined progression of value realization. The relationship supports
        explicit ordering without requiring an implementation-specific
        workflow.
      lifecycle_status: established
      provenance: CR-ES-003 §10.8 + ADR-ES-003 §20

    - id: ES:REL:stage-realized-through
      canonical_name: stage-realized-through
      inverse: stage-realizes
      subject_type: ES:CONCEPT:value-stage
      object_type: external:concept:process
      definition: |
        A Value Stage is realized through a Process when execution of the
        Process contributes to the transition represented by the Value Stage.
        Per VS-INV-008 (Value Stage is not inherently a Process).
      lifecycle_status: established
      provenance: CR-ES-003 §10.9 + ADR-ES-003 §8

    - id: ES:REL:requires
      canonical_name: requires
      inverse: required-by
      subject_type: ES:CONCEPT:value-stage
      object_type: ES:CONCEPT:capability
      definition: |
        A Value Stage requires a Capability when the Capability provides an
        ability necessary for the stage to be realized.
      lifecycle_status: established
      provenance: CR-ES-003 §10.10 + ADR-ES-003 §9

    - id: ES:REL:stage-produces
      canonical_name: stage-produces
      inverse: stage-produced-by
      subject_type: ES:CONCEPT:value-stage
      object_type: external:concept:outcome
      definition: |
        A Value Stage produces an Outcome when completion of the stage results
        in the specified outcome.
      lifecycle_status: established
      provenance: CR-ES-003 §10.11 + ADR-ES-003 §11

    - id: ES:REL:contributes-to
      canonical_name: contributes-to
      inverse: receives-contribution-from
      subject_type: ES:CONCEPT:value-stage
      object_type: external:concept:stakeholder-value
      definition: |
        A Value Stage contributes to Stakeholder Value when the stage outcome
        contributes to the overall stakeholder value realized by the parent
        Value Stream.
      lifecycle_status: established
      provenance: CR-ES-003 §9 (relationship table) + ADR-ES-003 §20


    # ;;; CR-ES-005 §7 ;; Agentic Value Stream predicates ;; VS-B tranche
    - id: ES:REL:specializes
      canonical_name: specialises
      inverse: generalised-by
      subject_type: ES:CONCEPT:agentic-value-stream
      object_type: ES:CONCEPT:value-stream
      definition: |
        An Agentic Value Stream specialises a Value Stream when the agentic
        participation is a governed specialisation of the parent Value
        Stream semantics. Per CR-ES-005 §5 + §7 + ADR-ES-005 §2 + §7.
        The specialised construct retains the parent's mandatory
        properties (per CR-ES-005 §8 inheritance requirements).
      lifecycle_status: established
      provenance: CR-ES-005 §5 + §7 + ADR-ES-005 §2 + §7

    - id: ES:REL:engages
      canonical_name: engages
      inverse: engaged-by
      subject_type: ES:CONCEPT:agentic-value-stream
      object_type: ES:CONCEPT:agent
      definition: |
        An Agentic Value Stream engages an Agent when agentic participation
        materially contributes to value realization. Per CR-ES-005 §7
        + ADR-ES-005 §7 + §14. The engaged Agent inherits its semantic
        properties from CR-ES-004 (interprets Intent, acts-within
        Authority, selects Action, coordinates Action, produces Outcome,
        adapts-to Context).
      lifecycle_status: established
      provenance: CR-ES-005 §7 + ADR-ES-005 §7 + §14

    - id: ES:REL:agent-realizes
      canonical_name: agent-realises-stage
      inverse: stage-agent-realised-by
      subject_type: ES:CONCEPT:agentic-value-stream
      object_type: ES:CONCEPT:value-stage
      definition: |
        A Value Stage within an Agentic Value Stream is realised agentically
        when the stage's value transition involves agentic participation.
        Per ADR-ES-005 §6 + §7. The namespaced predicate name
        (agent-realizes, not realizes) disambiguates from the inherited
        Value Stream realisation relationship (CR-ES-005 §7) and avoids
        cross-CR subject-type collision.
      lifecycle_status: established
      provenance: ADR-ES-005 §6 + §7 + CR-ES-005 §6


    # ===== Agentic Workflow ;;; Subject predicates (CR-ES-006 §5 + §18 + ADR-ES-006 §18) =====

    - id: ES:REL:operates-within
      canonical_name: operates-within
      inverse: governs
      subject_type: ES:CONCEPT:agentic-workflow
      object_type: ES:CONCEPT:authority
      definition: |
        An Agentic Workflow operates within Authority when its dynamic
        decisions ;;; action selections ;;; routing choices ;;; and
        escalation requests are constrained by a defined authority. Per
        ADR-ES-006 §4.6 (Bounded Decision Authority) + §11 (Authority
        Boundary) ;;; and CR-ES-006 §13 (Authority Integration).
      lifecycle_status: established
      provenance: ADR-ES-006 §18 + CR-ES-006 §5 + §13

    - id: ES:REL:process-realized-through
      canonical_name: realized-through
      inverse: realizes-process
      subject_type: external:concept:process
      object_type: ES:CONCEPT:workflow ;;; may resolve to agentic-workflow via subtyping
      definition: |
        A Process is realized through a Workflow when workflow execution
        produces the process outcomes. Per ADR-ES-006 §6 (Relationship to
        Process) ;;; CR-ES-006 §9 (Process Integration). When the Workflow
        is an Agentic Workflow ;; the process is realized through an
        agentic execution. The predicate is namespaced
        (process-realized-through) to disambiguate from
        value-stream-realized-through and capability-realized-through.
      lifecycle_status: established
      provenance: ADR-ES-006 §6 + CR-ES-006 §9


    # ===== Agentic Operations ;;; Subject predicates (CR-ES-007 §21 + ADR-ES-007 §21) =====

    - id: ES:REL:responds-to
      canonical_name: responds-to
      inverse: evokes-response-from
      subject_type: ES:CONCEPT:agentic-operations
      object_type: external:concept:operational-context
      definition: |
        An Agentic Operations responds-to Operational Context when
        the operational sensing ;; interpretation ;; and decision
        process engages with operational conditions ;; events ;;;
        signals ;; or state changes. Per ADR-ES-007 §6.1 + §6.2 +
        §16 + §21 + CR-ES-007 §8.3 + §17 (Operational Control Loop).
      lifecycle_status: established
      provenance: ADR-ES-007 §21 + CR-ES-007 §8.3

    - id: ES:REL:governed-by
      canonical_name: governed-by
      inverse: governs
      subject_type: ES:CONCEPT:agentic-operations
      object_type: external:concept:policy
      definition: |
        An Agentic Operations is governed-by Policy when the
        operational behavior is constrained by applicable policies ;;;
        rules ;; or equivalent operational constraints. Per ADR-ES-007
        §6.7 + §21 + CR-ES-007 §8.5 + §15.
      lifecycle_status: established
      provenance: ADR-ES-007 §21 + CR-ES-007 §8.5


    # ===== Autonomous Operations ;;; Subject predicate (CR-ES-008 §9.7 + ADR-ES-008 §17) =====

    - id: ES:REL:escalates-to
      canonical_name: escalates-to
      inverse: receives-escalation-from
      subject_type: ES:CONCEPT:autonomous-operations
      object_type: external:concept:human-authority
      definition: |
        An Autonomous Operations escalates-to Human / Authority when
        operational decisions exceed delegated authority ;; policy
        boundaries ;; risk thresholds ;; or capability limits. Per
        ADR-ES-008 §7.8 (Escalation characteristic) + §8 (Human
        Governance Boundary) + §17 + CR-ES-008 §9.7 + §15
        (Autonomous Operational Loop).
      lifecycle_status: established
      provenance: ADR-ES-008 §17 + CR-ES-008 §9.7


    # ===== Autonomous Value Stream ;;; Subject predicate (CR-ES-009 §8 + ADR-ES-009 §18) =====

    - id: ES:REL:contains
      canonical_name: contains
      inverse: is-contained-in
      subject_type: ES:CONCEPT:autonomous-value-stream
      object_type: ES:CONCEPT:value-stage
      definition: |
        An Autonomous Value Stream contains Value Stages. Per ADR-ES-009
        §4 + §11 + §18 + CR-ES-009 §5 + §8 + §9 (Value Stage Integrity)
        + AVS-AUTO-INV-005. The Autonomous Value Stream does NOT
        introduce Autonomous Value Stage ;; per ADR-ES-009 §11 + §20.
      lifecycle_status: established
      provenance: ADR-ES-009 §18 + CR-ES-009 §8


    # ===== Enterprise ;;; Subject namespaced predicates (CR-ES-010 §4 + ADR-ES-010 §5 + §15) =====

    - id: ES:REL:enterprise-realizes-through
      canonical_name: realizes-through
      inverse: realizes-via
      subject_type: ES:CONCEPT:agentic-enterprise
      object_type: ES:CONCEPT:agentic-value-stream
      definition: |
        An Agentic Enterprise realizes value through Agentic Value
        Streams ;; per CR-ES-010 §4 + ADR-ES-010 §5 + §14. The
        predicate is subject-type namespaced
        (enterprise-realizes-through) to disambiguate from
        value-stream-realized-through (subject_type:
        ES:CONCEPT:value-stream ;; CR-ES-003 §10.4) and
        capability-realized-through (subject_type:
        ES:CONCEPT:capability ;; CR-ES-002 §4). The predicate
        does NOT imply Agentic Enterprise = an enterprise
        containing value-streamrealisations ;; per CR-ES-010 §22 (the
        qualification is enterprise-realisation-via-value-stream).
        Enterprise-level realisation requires material
        enterprise-level evidence ;; not every value stream must
        be Agentic ;; per CR-ES-010 §22 (Agentic Enterprise does
        not require every Value Stream to be Agentic).
      lifecycle_status: proposed
      provenance: CR-ES-010 §4 + ADR-ES-010 §5 + §14

    - id: ES:REL:enterprise-operates-through
      canonical_name: operates-through
      inverse: operates-via
      subject_type: ES:CONCEPT:agentic-enterprise
      object_type: ES:CONCEPT:agentic-operations
      definition: |
        An Agentic Enterprise operates through Agentic
        Operations ;; per CR-ES-010 §4 + ADR-ES-010 §5 + §15. The
        predicate is subject-type namespaced
        (enterprise-operates-through) to disambiguate from the
        broader operates-through family. The predicate does NOT
        imply Agentic Enterprise = Agentic Operations ;; per
        CR-ES-010 §22 + AE-NEG-011 (the qualification is
        enterprise-operation-mechanism). Agentic Operations are
        an important realisation mechanism ;;; Agentic Enterprise
        is the enterprise-level operating condition.
      lifecycle_status: proposed
      provenance: CR-ES-010 §4 + ADR-ES-010 §5 + §15
