authority: WSF
source_decision: ADR-WSF-38 (Baseline, WSF PR #19 MERGED 2026-09-27)
es_integration: ES-ADR-035 + CR-ES-035
definition: |
  A Closed Loop is a control structure with four stages (sense, decide,
  act, learn) connected by feedback such that the output of act influences
  subsequent sense iterations. Per ADR-WSF-38 section 2.
properties:
  - sense_stage
  - decide_stage
  - act_stage
  - learn_stage
  - feedback_connection
  - target_state
  - policy
relationships:
