definition: |
  A Network is a structural topology of interconnected entities, nodes,
  and links whose identity is defined by the connection structure.
  Per ADR-WSF-37 section 2. Network has connection-identity distinct
  from System (bounded-identity) and Ecosystem (context-sharing-emergent).
