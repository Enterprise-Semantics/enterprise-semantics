# concepts/offering.concept.yaml ; Offering canonical concept

# Per ADR-ES-021 + CR-ES-021 ; Offering is a foundational concept
# in Enterprise-Semantics. This file establishes the canonical
# grounding that ADR-ES-018 (Agentic Offering) and ADR-ES-019
# (Autonomous Offering) specialize. Per CR-ES-021 section 3.

# Authored by: Emmanuel A. Otchere (cardinal author rule, 2026-09-24)

id: ES:CONCEPT:offering
canonical_name: Offering
status: Candidate
version: 1.8.1
concept_type: offering
governance: enterprise-semantics
definition: |
  An Offering is a coordinated bundle of Products, Services, and
  Capabilities that an enterprise or organizational unit commits
  to make available to a Customer (internal or external) in order
  to satisfy a defined Customer Need, within defined Authority,
  Policy, Constraints, and Governance, and that progresses
  through Offering Context Assessment, Configuration,
  Composition, Fulfillment, and Value Realization to produce
  Customer Outcome. Per ADR-ES-021 section 1 + CR-ES-021 section 3.

relationships:
  - predicate: addresses
    object: external:concept:customer-need
    provenance: ADR-ES-021 section 4
  - predicate: composes
    object: external:concept:product
    provenance: ADR-ES-021 section 4
  - predicate: composes
    object: external:concept:service
    provenance: ADR-ES-021 section 4
  - predicate: exercises
    object: external:concept:capability
    provenance: ADR-ES-021 section 4
  - predicate: pursues
    object: external:concept:objective
    provenance: ADR-ES-021 section 4
  - predicate: responds-to
    object: external:concept:context
    provenance: ADR-ES-021 section 4
  - predicate: operates-within
    object: external:concept:authority
    provenance: ADR-ES-021 section 4
  - predicate: governed-by
    object: external:concept:policy
    provenance: ADR-ES-021 section 4
  - predicate: constrained-by
    object: external:concept:constraint
    provenance: ADR-ES-021 section 4
  - predicate: fulfilled-through
    object: external:concept:fulfillment-process
    provenance: ADR-ES-021 section 4
  - predicate: produces
    object: external:concept:customer-outcome
    provenance: ADR-ES-021 section 4
  - predicate: realizes
    object: external:concept:value
    provenance: ADR-ES-021 section 4
  - predicate: escalates-through
    object: external:concept:escalation-boundary
    provenance: ADR-ES-021 section 4

properties:
  customer_need: string
  offering_objective: string
  offering_context: string
  authority_context: string
  policy_context: string
  constraint_context: string
  governance_context: string
  configuration_scope: string
  composition_scope: string
  fulfillment_scope: string
  value_realization_scope: string
  customer_outcome_scope: string
  escalation_boundary: string

specializations:
  - specialization: agentic-offering
    adr: ADR-ES-018
    cr: CR-ES-018
    resolved_status: documented ; awaiting CR-ES-021 for resolution
  - specialization: autonomous-offering
    adr: ADR-ES-019
    cr: CR-ES-019
    resolved_status: documented ; awaiting CR-ES-021 for resolution

provenance:
  source:
