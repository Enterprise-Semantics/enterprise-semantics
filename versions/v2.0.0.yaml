organizational_structure:
  description: |
    Per ADR-ES-021 final section, the resulting organization model:
                         Organization
                              |
                    +---------+---------+
                    |                   |
             Agentic Organization   Autonomous Organization
                    |                   |
                    +---------+---------+
                              |
                    Agentic + Autonomous
                    Organization
                    (orthogonal state)
  note: |
    Organization now has the same Agentic/Autonomous semantic
    treatment as Capability, Service, Product, Offering, Value
    Stream, Operations, and Enterprise. Neither dimension
    subsumes the other.

