supersedes: ES-ADR-035 (voided 2026-09-28 ;;; was WSF Closed Loop integration)
superseding:
  - ES-ADR-034 (Closed Loop behavioral_pattern ;;; pending filing)
  - ES-ADR-035 (Autonomous Closed Loop specialization ;;; pending filing)
wsf_reference: wsf:ClosedLoop (Tier 3 Baseline, parent wsf:Process)
deprecation_reason: Closed Loop now established as behavioral_pattern per ES-034
deprecation_date: 2026-09-28
semantic_kind: behavioral_pattern (per ES-034, pending)
definition: |
  A Closed Loop is a bounded behavioral cycle in which observations of
  conditions or outcomes are fed back into subsequent interpretation,
  decision, action, or adaptation toward an intended objective or outcome.
  Per ES-ADR-034 (pending filing) section 2. Feedback is the defining
  criterion ; Closed Loop does not imply Agentic or Autonomous behavior.
four_state_characterization:
  - Conventional Closed Loop
  - Agentic Closed Loop  (deferred per ES-ADR-034 section 8)
  - Autonomous Closed Loop  (per ES-035, pending)
  - Agentic + Autonomous Closed Loop  (deferred per ES-ADR-034 section 8)
cross_context_instantiation:
  - Process
  - Workflow
  - Service
  - System
  - Operations
  - Network
  - Ecosystem
  - Enterprise
note: |
  This concept record is a reference stub. The full canonical definition
  has moved to ES-034 + ES-035 pair per the user-authoritative model
  (semantic_kind: behavioral_pattern, not WSF-level specialization).
