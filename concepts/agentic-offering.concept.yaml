# concepts/agentic-offering.concept.yaml ;; Agentic Offering (ES:CONCEPT:agentic-offering) ;; per CR-ES-018 §3 + ADR-ES-018 §1
#
# Per CR-ES-018 §3 + ADR-ES-018 §1:
#   An Agentic Offering is an Offering whose composition,
#   interaction, configuration, fulfillment, or value realization
#   materially incorporates agentic behavior in interpreting intent,
#   selecting or coordinating actions, or adapting the offering
#   toward an intended stakeholder outcome within defined authority,
#   policy, and contextual boundaries.
#
# Specialisation of Offering (not replacement ;; not parallel
# construct). Per CR-ES-018 §3 + ADR-ES-018 §1, this record does
# NOT redefine foundational Offering semantics.
#
# FOUNDATIONAL DEPENDENCY GATE (per ADR-ES-018 §16 + CR-ES-018 §2):
# This specialization depends on `Offering` being canonical in
# Enterprise-Semantics. Per the dependency gate, before canonical
# implementation, the repository must verify one of:
#   1. Offering already exists as a canonical Enterprise-Semantics
#      concept ;; or
#   2. a separately authorized Offering semantic grounding ADR
#      establishes it.
# If neither condition is satisfied, implementation of the
# specialization shall remain blocked. CR-ES-018 shall not create
# Offering implicitly.
#
# STATUS AS OF 2026-09-25 (per user directive message
# 1552900782440058902, "Proceed with 18"):
#   The user has explicitly directed implementation of ES-018 to
#   proceed without a separate Offering grounding ADR. This is a
#   deliberate override of the Path X BLOCK confirmation from
#   message 1552885930522706062. Per the user's explicit authority,
#   this specialization concept is established with the dependency
#   documented rather than blocked. The specialization refines an
#   external:offering:Offering grounding that is NOT yet canonical
#   in Enterprise-Semantics. This is acknowledged and documented
#   per ADR-ES-018 §16 dependency gate.
#
# Per ADR-ES-018 §15 + CR-ES-018 §8-§12, the implementation shall
# reject Agentic Offering -> Agent, Agentic Product, Agentic Service,
# Agentic Workflow, Agentic Operations, Agentic Value Stream, Agentic
# Enterprise, or AI Offering inheritance. AI is NOT required,
# automation is NOT sufficient, human participation remains valid.
#
# Authored by: Emmanuel A. Otchere (cardinal author rule, 2026-09-24)

id: ES:CONCEPT:agentic-offering
canonical_name: Agentic Offering
definition: |
  An Offering whose composition, interaction, configuration,
  fulfillment, or value realization materially incorporates agentic
  behavior in interpreting intent, selecting or coordinating
  actions, or adapting the offering toward an intended stakeholder
  outcome within defined authority, policy, and contextual
  boundaries.
  The Offering concept remains the universal foundational concept at
  the Offering boundary ;; Agentic Offering is a contextual
  specialization, not a replacement or narrowing of Offering.
  Agentic behavior must be material to offering realization ;; AI,
  automation, chatbot interface, Agent participation, or automated
  billing/ordering alone do not establish Agentic Offering.
status: Candidate
version: 1.7.0
concept_type: agentic-offering
specializes:
  - canonical_id: external:offering:Offering
    relationship: specialization-of
    rationale: |
      Agentic Offering is a contextual specialization of the
      universal Offering concept. The semantic distinction remains:
      Offering describes what an organization makes available to a
      stakeholder or market as a coherent proposition ;; Agentic
      Offering additionally describes how that offering is realized
      through material agentic behavior within defined authority,
      policy, and contextual boundaries.
    dependency_note: |
      Per ADR-ES-018 §16 + CR-ES-018 §2 Foundational Dependency
      Gate. The parent Offering concept is NOT yet canonical in
      Enterprise-Semantics as of 2026-09-25. Implementation
      proceeded per user directive message 1552900782440058902
      ("Proceed with 18") overriding the Path X BLOCK from
      message 1552885930522706062. ADR-ES-019 (Offering canonical
      grounding) remains held as the next-foundational tranche to
      canonicalize the parent.
wsf_grounding:
  - wsf_concept_id: external:wsf:Offering
    relationship: references
    note: |
      Agentic Offering inherits the WSF Offering grounding via its
      parent Offering concept.
