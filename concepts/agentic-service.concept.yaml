id: ES:CONCEPT:agentic-service
canonical_name: Agentic Service
definition: |
  An Agentic Service is a Service whose delivery or interaction
  materially incorporates agentic behavior in interpreting intent,
  selecting or coordinating actions, adapting service behavior, or
  executing service responses toward an intended outcome within
  defined authority, policy, and contextual boundaries.
  The Service concept remains the universal foundational type per
  ADR-ES-002 ; Agentic Service is a contextual specialization, not
  a replacement or narrowing of Service. Agentic behavior must be
  material to service realization ; AI, automation, Agent
  participation, or autonomous behavior alone do not establish
  Agentic Service.
status: Candidate
version: 1.3.0
concept_type: agentic-service
specializes:
  - canonical_id: ES:CONCEPT:service
    relationship: specialization-of
    rationale: |
      Agentic Service is a contextual specialization of the Service
      concept. The Service concept remains universal per ADR-ES-002 ;
      Agentic Service does not redefine Service.
wsf_grounding:
  - wsf_concept_id: external:wsf:Service
    relationship: references
    note: |
      Agentic Service inherits the WSF Service grounding via its
      parent Service concept. The specialization does not introduce
      a new WSF semantic kind.
profile_bindings: []
relationships:
  - subject: ES:CONCEPT:agentic-service
    predicate: specialization-of
    object: external:service:Service
    qualification: contextual-specialization
    status: proposed
    provenance: ADR-ES-014 §3 ; CR-ES-014 §3
    rationale: |
      Agentic Service is a contextual specialization of Service,
      not a new foundational type of service. The Service concept
      remains universal per ADR-ES-002.
  - subject: ES:CONCEPT:agentic-service
    predicate: engages
    object: ES:CONCEPT:agent
    qualification: agent-engagement
    status: proposed
    provenance: ADR-ES-014 §6 ; CR-ES-014 §7
    rationale: |
      Agentic Service may engage an Agent. An Agent may participate
      in an Agentic Service without being the Service itself per
      ASVC-NEG-001.
  - subject: ES:CONCEPT:agentic-service
    predicate: interprets
    object: external:concept:intent
    qualification: intent-interpretation
    status: proposed
    provenance: ADR-ES-014 §7 ; CR-ES-014 §7
    rationale: |
      Agentic Service may interpret intent (delegated service
      intent) as material agentic behavior.
  - subject: ES:CONCEPT:agentic-service
    predicate: operates-within
    object: external:concept:authority
    qualification: authority-bounded
    status: proposed
    provenance: ADR-ES-014 §15 ; CR-ES-014 §7
    rationale: |
      Agentic Service operates within defined Authority
      boundaries.
  - subject: ES:CONCEPT:agentic-service
    predicate: governed-by
    object: external:policy:Policy
    qualification: policy-compliance
    status: proposed
    provenance: ADR-ES-014 §15 ; CR-ES-014 §7
    rationale: Agentic Service is governed by applicable Policy.
  - subject: ES:CONCEPT:agentic-service
    predicate: uses
    object: ES:CONCEPT:agentic-workflow
    qualification: workflow-usage
    status: proposed
    provenance: ADR-ES-014 §8 ; CR-ES-014 §7
    rationale: |
      Agentic Service may use one or more Agentic Workflows. The
      workflow is an execution mechanism ; the service is the
      service-level construct.
  - subject: ES:CONCEPT:agentic-service
    predicate: produces
    object: external:outcome:Outcome
    qualification: outcome-production
    status: proposed
    provenance: ADR-ES-014 §16 ; CR-ES-014 §7
    rationale: Agentic Service produces Service Outcomes.
  - subject: ES:CONCEPT:agentic-service
    predicate: adapts-to
    object: external:concept:context
    qualification: adaptive-realization
    status: proposed
    provenance: ADR-ES-014 §5 ; CR-ES-014 §7
    rationale: Agentic Service may adapt to Contextual Adaptation per ASVC-CON-008.
  - subject: ES:CONCEPT:agentic-service
    predicate: delivers
    object: external:concept:value
    qualification: value-delivery
    status: proposed
    provenance: ADR-ES-014 §15 ; CR-ES-014 §7
    rationale: Agentic Service delivers Value to consumers/stakeholders.
  - subject: ES:CONCEPT:agentic-service
    predicate: supports
    object: ES:CONCEPT:capability
    qualification: capability-support
    status: proposed
    provenance: ADR-ES-014 §15 ; CR-ES-014 §7
    rationale: |
      Agentic Service supports Capability realization. The relationship
      is support, not inheritance ; the Capability remains
      foundational.
  - subject: ES:CONCEPT:agentic-service
    predicate: distinct-from
    object: ES:CONCEPT:agent
    qualification: service-vs-agent
    status: proposed
    provenance: ADR-ES-014 §6 ; CR-ES-014 §11 ; ASVC-NEG-001
    rationale: |
      Agentic Service is NOT an Agent. An Agent may participate in an
      Agentic Service without being the Service itself.
  - subject: ES:CONCEPT:agentic-service
    predicate: distinct-from
    object: ES:CONCEPT:agentic-capability
    qualification: service-vs-capability
    status: proposed
    provenance: ADR-ES-014 §7 ; CR-ES-014 §11 ; ASVC-NEG-002
    rationale: |
      Agentic Service is the means through which a capability or
      service outcome is made available ; Agentic Capability is the
      enduring ability. They are distinct semantic kinds.
  - subject: ES:CONCEPT:agentic-service
    predicate: distinct-from
    object: ES:CONCEPT:agentic-workflow
    qualification: service-vs-workflow
    status: proposed
    provenance: ADR-ES-014 §8 ; CR-ES-014 §11 ; ASVC-NEG-003
    rationale: |
      Agentic Workflow is the execution mechanism ; Agentic Service
      is the service-level construct. They are distinct semantic
      kinds.
  - subject: ES:CONCEPT:agentic-service
    predicate: distinct-from
    object: ES:CONCEPT:agentic-operations
    qualification: service-vs-operations
    status: proposed
    provenance: ADR-ES-014 §9 ; CR-ES-014 §11 ; ASVC-NEG-004
    rationale: |
      Agentic Service is the service boundary ; Agentic Operations
      is the operations boundary. Agentic Operations do NOT make
      every Service Agentic.
  - subject: ES:CONCEPT:agentic-service
    predicate: distinct-from
    object: ES:CONCEPT:agentic-value-stream
    qualification: service-vs-value-stream
    status: proposed
    provenance: ADR-ES-014 §10 ; CR-ES-014 §11 ; ASVC-NEG-005
    rationale: |
      Agentic Service is service-level delivery ; Agentic Value
      Stream is end-to-end value realization. Agentic Value Stream
      may use multiple Agentic Services ; Agentic Service does NOT
      imply Agentic Value Stream.
  - subject: ES:CONCEPT:agentic-service
    predicate: not-implies
    object: external:concept:autonomous-service
    qualification: agentic-not-autonomous
    status: proposed
    provenance: ADR-ES-014 §11 ; CR-ES-014 §9 ; ASVC-NEG-006
    rationale: |
      Agentic Service does NOT imply Autonomous Service. The two
      dimensions remain orthogonal at the service boundary. Future
      Autonomous Service requires a separate ADR per ADR-ES-014 §19.
  - subject: ES:CONCEPT:agentic-service
    predicate: not-implies
    object: external:concept:ai-service
    qualification: ai-not-required
    status: proposed
    provenance: ADR-ES-014 §12 ; CR-ES-014 §17 ; ASVC-CON-014 ; ASVC-NEG-007
    rationale: |
      Agentic Service does NOT require AI. AI-enabled Service is NOT
      automatically Agentic Service per ASVC-NEG-008.
  - subject: ES:CONCEPT:agentic-service
    predicate: not-implies
    object: external:concept:automated-service
    qualification: automation-not-sufficient
    status: proposed
    provenance: ADR-ES-014 §13 ; CR-ES-014 §17 ; ASVC-CON-015 ; ASVC-NEG-009
    rationale: |
      Agentic Service does NOT require Automation. Automated Service
      is NOT automatically Agentic Service per ASVC-NEG-009.
  - subject: ES:CONCEPT:agentic-service
    predicate: materiality-required
    object: external:concept:agentic-behavior
    qualification: materiality-rule
    status: proposed
    provenance: ADR-ES-014 §4 ; CR-ES-014 §8 ; ASVC-CON-003
    rationale: |
      Agentic Service requires material agentic behavior in service
      realization. Mere use of AI, an Agent, an API, or automation
      does NOT establish Agentic Service.
governance: enterprise-semantics
provenance:
  - source: ADR-ES-002
    note: "Universal Service concept grounding ; semantic_type basis."
  - source: ADR-ES-003
    note: "Value Stream lineage ; Agentic Service supports Value."
  - source: ADR-ES-004
    note: "Agentic semantic grounding ; behavioral foundation."
  - source: ADR-ES-005
    note: "Agentic Value Stream lineage ; Agentic Service may be consumed by Agentic Value Stream."
  - source: ADR-ES-006
    note: "Agentic Workflow lineage ; Agentic Service may use Agentic Workflow."
  - source: ADR-ES-007
    note: "Agentic Operations lineage ; Agentic Service may operate within Agentic Operations."
  - source: ADR-ES-012
    note: "Agentic Capability lineage ; establishes the Agentic Capability -> Agentic Service -> Agentic Value Stream traceability."
  - source: ADR-ES-014
    note: |
      Foundational specialization decision ; v1.3.0 release target ;
      ASVC-CON-001..019 invariants established ; Agentic Materiality
      rule at §4 ; service-level orthogonality with Autonomous
      Service at §11 ; agentic behavior must be material at §4.
  - source: CR-ES-014
    note: |
      Implementation specification ; canonical concept record ;
      schema requirements at §4 ; required relationships at §7 ;
      registry addition at §5 ; profile binding at §6 ; WSF mapping
      at §15 ; OpenDEA mapping at §15 ; materiality rule at §8 ;
      Agentic/Autonomous orthogonality at §9.
  - source: FND-ES-AG-008
    note: "WSF Tier 1 / Tier 2 Grounding Boundary (Established 2026-09-22)."
mappings:
  - authority: wsf
    target_id: external:wsf:Service
    relationship: references
    note: |
      Inherits WSF Service grounding via the parent Service concept.
      The specialization does not introduce a new WSF semantic kind.
      Detailed mapping at
      enterprise-semantics-mappings/wsf/agentic-service.yaml
      (canonicalisation held for VS-C slice).
  - authority: opendea
    target_id: external:opendea:Service
    relationship: references
    note: |
      References OpenDEA Service semantics without modifying the
      OpenDEA metamodel. Detailed mapping at
      enterprise-semantics-mappings/opendea/agentic-service.yaml
      (canonicalisation held for VS-C slice).
