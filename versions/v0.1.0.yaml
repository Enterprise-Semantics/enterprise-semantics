release_notes: |
  Establishes the foundational Capability semantic concept in
  Enterprise-Semantics. Per CR-ES-002 §2.1, Capability is "an enduring
  ability of an Entity to achieve or enable an Outcome." Per FND-ES-AG-008
  §1.3, ES capability is classified as Tier 2 Specialisation under the
  WSF pre-declared Capability specialisation pattern, provisional
  Business-Capability equivalent.

  This version introduces:

  - canonical Capability definition
  - 8 exclusion boundaries (Process, Function, Role, Service, etc.)
  - 9 governed relationship predicates (possesses, enables,
    realized-through, exercised-by, supported-by, delivered-through,
    implemented-by, contributes-to, supports)
  - 9 inverse predicate mappings
  - 3 mapping records (wsf, opendea, dea-catalogs)
  - 12 CAP-001..012 validation rules
  - 7 test groups (identity, schema, relationships, boundaries,
    provenance, grounding, specialization)
  - 3 documentation files (canonical, boundary, relationships)
  - 1 OTCHERE Inc worked example
  - Capability status: Candidate, v0.2.0

  This version does NOT establish Agentic Capability, Autonomous
  Capability, Business Capability, Operational Capability, Technical
  Capability, Organisational Capability, Digital Capability, or any
  other Capability specialisation as a foundational concept.

cardinal_rules:
