    note: Version increment rationale.
  - source: ADR-ES-006 §26
    note: |
      Decision summary ;; Agentic Workflow establishes agentic execution
      and coordination semantics without redefining the process being
      executed or the value stream being realized.
  - source: ADR-ES-005 §21
    note: "Next Decision Candidates ;;; ADR-ES-006 chosen as natural follow-on."
  - source: FND-ES-AG-008 §1.3
    note: "Tier 1 / Tier 2 grounding classification."
  - source: https://github.com/World-Semantic-Foundation
    note: WSF Activity grounding inherited via Workflow.