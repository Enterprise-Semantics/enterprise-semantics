# concepts/autonomous-organization.concept.yaml ; Autonomous Organization

# Per CR-ES-021 section 3 + ADR-ES-021 section 1:
#   An Autonomous Organization is an Organization in which
#   material organizational decisions, coordination, execution,
#   or adaptation are capable of progressing independently
#   within defined objectives, authority, policies, constraints,
#   accountability, and governance boundaries without requiring
#   human intervention for every organizational decision or action.
#
# Specialisation of Organization. Per CR-ES-021 section 3 +
# ADR-ES-021 section 1, this record does NOT redefine foundational
# Organization semantics.
#
# FOUNDATIONAL DEPENDENCY (resolved):
# This specialization depends on `Organization` being canonical
# in Enterprise-Semantics. Per CR-ES-021 section 2 + ADR-ES-022,
# the parent Organization concept IS canonical as of 2026-09-25
# (organization.concept.yaml exists on origin/main). Dependency
# resolved.
#
# Per ADR-ES-021 section 11, AI is NOT required and automation is
# NOT sufficient. Human participation remains valid. Material
# organizational autonomy must be demonstrated.
#
# Authored by: Emmanuel A. Otchere (cardinal author rule, 2026-09-24)

id: ES:CONCEPT:autonomous-organization
canonical_name: Autonomous Organization
definition: |
  An Autonomous Organization is an Organization in which material
  organizational decisions, coordination, execution, or adaptation
  are capable of progressing independently within defined
  objectives, authority, policies, constraints, accountability, and
  governance boundaries without requiring human intervention for
  every organizational decision or action.
  The Organization concept remains the universal foundational
  concept at the Organization boundary ;; Autonomous Organization
  is a contextual specialization, not a replacement or narrowing
  of Organization.
  Material organizational autonomy must be demonstrated ;; AI,
  automation, autonomous software, autonomous services, autonomous
  products, autonomous offerings, autonomous operations, or Agent
  participation alone do not establish Autonomous Organization.
status: Candidate
version: 2.0.0
concept_type: autonomous-organization
governance: enterprise-semantics

specializes:
  - canonical_id: external:organization:Organization
    relationship: specialization-of
    rationale: |
      Autonomous Organization is a contextual specialization of the
      universal Organization concept. The semantic distinction
      remains: Organization describes the coordinated boundary of
      actors, roles, responsibilities, authority, resources, and
      activities ;; Autonomous Organization additionally describes
      how that organizational behavior is realized through
      material organizational autonomy within defined governance
      boundaries.
    dependency_note: |
      Per CR-ES-021 section 2 dependency gate. The parent
      Organization concept is canonical in Enterprise-Semantics
      per ADR-ES-022 (slot 0024) + CR-ES-022 (slot 0030). The
      canonical concept YAML lives on the
      docs/cr-es-022-vs-a-organization-concepts branch (not yet
      merged to origin/main). This specialization therefore uses
      the external:organization:Organization forward-reference
      pattern established by ES-018 section 3 + ES-019 section 3
      + ES-020 section 3. Dependency is resolved at the
      governance level.

relationships:
  - subject: ES:CONCEPT:autonomous-organization
    predicate: specialization-of
    object: external:organization:Organization
    qualification: contextual-specialization
    status: proposed
    provenance: ADR-ES-021 section 1 ; CR-ES-021 section 3
    rationale: |
      Autonomous Organization is a contextual specialization of
      the universal Organization concept.
  - subject: ES:CONCEPT:autonomous-organization
    predicate: operates-within
    object: external:concept:authority
    qualification: bounded-authority
    status: proposed
    provenance: ADR-ES-021 section 9 ; CR-ES-021 section 5
    rationale: |
      Autonomous Organization operates within Authority ;; autonomy
      does not imply unrestricted discretion.
  - subject: ES:CONCEPT:autonomous-organization
    predicate: governed-by
    object: external:concept:policy
    qualification: policy-bounded
    status: proposed
    provenance: ADR-ES-021 section 9 ; CR-ES-021 section 5
    rationale: |
      Autonomous Organization is governed by Policy ;; autonomy
      does not imply no governance.
  - subject: ES:CONCEPT:autonomous-organization
    predicate: constrained-by
    object: external:concept:constraint
    qualification: constraint-bounded
    status: proposed
    provenance: ADR-ES-021 section 9 ; CR-ES-021 section 5
    rationale: |
      Autonomous Organization is constrained by Constraint ;;
      autonomy does not imply unlimited authority.
  - subject: ES:CONCEPT:autonomous-organization
    predicate: pursues
    object: external:concept:organizational-objective
    qualification: objective-bounded
    status: proposed
    provenance: ADR-ES-021 section 9 ; CR-ES-021 section 5
    rationale: |
      Autonomous Organization pursues Organizational Objective ;;
      autonomy is bounded by objectives.
  - subject: ES:CONCEPT:autonomous-organization
    predicate: responds-to
    object: external:concept:organizational-context
    qualification: contextual
    status: proposed
    provenance: ADR-ES-021 section 9 ; CR-ES-021 section 5
    rationale: |
      Autonomous Organization responds to Organizational Context.
  - subject: ES:CONCEPT:autonomous-organization
    predicate: produces
    object: external:concept:organizational-outcome
    qualification: outcome-production
    status: proposed
    provenance: ADR-ES-021 section 9 ; CR-ES-021 section 5
    rationale: |
      Autonomous Organization produces Organizational Outcome.
  - subject: ES:CONCEPT:autonomous-organization
    predicate: adapts-to
    object: external:concept:organizational-context
    qualification: adaptation
    status: proposed
    provenance: ADR-ES-021 section 9 ; CR-ES-021 section 5
    rationale: |
      Autonomous Organization adapts to Organizational Context.
  - subject: ES:CONCEPT:autonomous-organization
    predicate: escalates-to
    object: external:concept:human-or-authority
    qualification: escalation-boundary
    status: proposed
    provenance: ADR-ES-021 section 9 ; CR-ES-021 section 5
    rationale: |
      Autonomous Organization escalates to Human or Authority
      when authority is exceeded.
  - subject: ES:CONCEPT:autonomous-organization
    predicate: uses
    object: external:concept:workflow
    qualification: workflow-support
    status: proposed
    provenance: ADR-ES-021 section 9 ; CR-ES-021 section 5
    rationale: |
      Autonomous Organization uses Workflow.
  - subject: ES:CONCEPT:autonomous-organization
    predicate: uses
    object: external:concept:agentic-workflow
    qualification: workflow-support
    status: proposed
    provenance: ADR-ES-021 section 9 ; CR-ES-021 section 5
    rationale: |
      Autonomous Organization uses Agentic Workflow.
  - subject: ES:CONCEPT:autonomous-organization
    predicate: uses
    object: external:concept:autonomous-operations
    qualification: operations-support
    status: proposed
    provenance: ADR-ES-021 section 9 ; CR-ES-021 section 5
    rationale: |
      Autonomous Organization uses Autonomous Operations.
  - subject: ES:CONCEPT:autonomous-organization
    predicate: uses
    object: external:concept:agentic-operations
    qualification: operations-support
    status: proposed
    provenance: ADR-ES-021 section 9 ; CR-ES-021 section 5
    rationale: |
      Autonomous Organization uses Agentic Operations.
  - subject: ES:CONCEPT:autonomous-organization
    predicate: exercises
    object: external:concept:capability
    qualification: capability-exercise
    status: proposed
    provenance: ADR-ES-021 section 9 ; CR-ES-021 section 5
    rationale: |
      Autonomous Organization exercises Capability.
  - subject: ES:CONCEPT:autonomous-organization
    predicate: contributes-to
    object: external:concept:value
    qualification: value-contribution
    status: proposed
    provenance: ADR-ES-021 section 9 ; CR-ES-021 section 5
    rationale: |
      Autonomous Organization contributes to Value.

