    predicate: foundation-anchored-to
    object: external:concept:WSF:CLOSED_LOOP
    status: established
    provenance: ES-ADR-034 section 2 ; ADR-WSF-38
  - subject: ES:CONCEPT:closed-loop
    predicate: uses-feedback-from
    object: external:concept:outcome
    status: established
    provenance: CR-ES-034 section 4
  - subject: ES:CONCEPT:closed-loop
    predicate: influences
