# concepts/agentic-culture.concept.yaml ; Agentic Culture Specialization
#
# Per CR-ES-023 section 3 + ADR-ES-023 section 1. Agentic Culture
# specializes Culture (canonical per ADR-ES-026 + CR-ES-026
# Accepted).
#
# Authored by: Emmanuel A. Otchere (cardinal author rule, 2026-09-24)

id: ES:CONCEPT:agentic-culture
canonical_name: Agentic Culture
definition: |
  A Culture in which organizational norms, values, practices,
  and expectations materially support the interpretation of
  delegated intent, distribution of decision authority,
  human-agent collaboration, adaptive action, and accountable
  coordination involving agentic behavior.
concept_type: agentic-culture
status: Candidate
version: 2.1.0
date: 2026-09-25
author: Emmanuel A. Otchere (cardinal author rule, 2026-09-24)
governance: enterprise-semantics

specializes:
  - ES:CONCEPT:culture

