  - id: ACULT-PROF-BND-006
    description: Agentic Culture is NOT AI Culture per ADR-ES-023 section 4 + ACULT-NEG-006.
  - id: ACULT-PROF-BND-007
    description: Agentic Culture is NOT Automated Culture per ADR-ES-023 section 4 + ACULT-NEG-007.
