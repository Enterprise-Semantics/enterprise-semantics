  novelty: agentic-organizational-coordination-representation
  no_modification: OpenDEA live baseline remains authoritative

mappings:
  - external:wsf:Organization
  - external:opendea:Organization

governance: enterprise-semantics

created: 2026-09-25
updated: 2026-09-25

