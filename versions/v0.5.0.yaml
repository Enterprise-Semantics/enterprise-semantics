# versions/v0.5.0.yaml ;;; Agentic Workflow semantic establishment
#
# Per CR-ES-006 §32 + ADR-ES-006 §26.
# This version indicates semantic establishment of the Agentic Workflow
# ;; a specialisation of Workflow. Per CR-ES-006 §32 the version bump
# rationale is:
#
#   * CR-ES-005 introduced Agentic Value Stream semantic specialisation
#   * CR-ES-006 introduces the execution-level Agentic Workflow specialisation
#   * the release adds a new canonical concept and associated mappings,
#     profiles, examples, and conformance artefacts
#
# No WSF or OpenDEA version increment is implied by this CR.

id: ES:VERSION:v0.5.0
canonical_name: v0.5.0
status: Candidate
date: 2026-09-23

# Release summary

release_summary: |
  Semantic establishment of the Agentic Workflow concept ;; a
  specialisation of Workflow ;; with 8 canonical relationships ;;
  8 properties ;; 8 characteristics ;; 8 invariants ;; and 2 mappings
  to WSF + OpenDEA. The release adds:
    - 1 concept record (ES:CONCEPT:agentic-workflow)
    - 2 governed predicates (operates-within ;; process-realized-through)
    - 2 inverse pairs
    - 1 ES:PROFILE:agentic-execution extension (Workflow + Agentic Workflow
      added to scope ;; existing profile already applies-to workflow)
    - 2 mapping records (WSF + OpenDEA)
    - 14 conformance rules (AWF-CON-001..014)
    - 10 negative tests
    - documentation + PlantUML visuals + OTCHERE Inc example

# Tranche boundaries

tranche_boundaries:
  - CR-ES-001 ;;; Profile Semantic Construct (scaffolding)
  - CR-ES-002 ;;; Capability Semantic Grounding (v0.1.0)
  - CR-ES-003 ;;; Value Stream Semantic Grounding (v0.2.0)
  - CR-ES-004 ;;; Agentic Semantic Grounding (v0.3.0 vocabulary ;; v0.4.0 vocabulary)
  - CR-ES-005 ;;; Agentic Value Stream Semantic Grounding (v0.4.0 version ;; v0.5.0 vocabulary)
  - CR-ES-006 ;;; Agentic Workflow Semantic Grounding (v0.5.0 version ;; v0.6.0 vocabulary) ;; THIS RELEASE

# Architectural position

architectural_position: |
  Per ADR-ES-006 §20 ;;; the canonical semantic boundary:
    VALUE REALIZATION
      Agentic Value Stream -> Value Stage
    WORK ORGANIZATION
      Process
    WORK EXECUTION
      Agentic Workflow
      Activity / Task
    IMPLEMENTATION
      Agent / Human / Service / System / Resource

# Grounding

grounding:
  foundation: WSF
  semantic_authority: Enterprise-Semantics
  classification: Tier 2 Specialisation + ES-canonical novelty
  ws_foundation_reference: external:wsf:Activity (via Workflow)
  notes: |
    Per FND-ES-AG-008 §1.3 ;;; Agentic Workflow is Tier 2 Specialisation
    ;;; WSF Tier 1 Workflow grounds the kernel Activity. ES-canonical
    novelty (the 8 characteristics ;;; 8 properties ;;; 8 canonical
    relationships).

# Cardinal rules

cardinal_rules:
  - author: Emmanuel A. Otchere
  - d004_dash_rule: 0 forbidden glyphs
  - vendor_specific_embargo: 0 references ;; no vendor-specific material from embargoed sources
  - naming: lowercase kebab-case per ADR-ES-002 §11
  - technology_neutral: no AI vendor ;; no specific framework ;; no LLM ;; per ADR-ES-006 §14

# Provenance

provenance:
