release_notes: |
  Value Stream semantic establishment. This release introduces the
  foundational Value Stream + Value Stage semantic layer per CR-ES-003
  and ADR-ES-003.

  Added (per CR-ES-003 §9 + §10):

  - 13 governed relationship predicates (8 for Value Stream subject + 5 for
    Value Stage subject).
  - 13 inverse pairs in relationships/inverse.yaml matching the 13
    predicates.
  - Refactored concepts/value-stream.concept.yaml to align with the
    foundational definition (was Agentic-era framing).
  - New concepts/value-stage.concept.yaml.

  Architectural boundaries preserved (per ADR-ES-003 §32 VS-INV-001..011):

  - Value Stream != Process
  - Value Stream != Capability
  - Value Stream != Workflow
  - Value Stream != Service
  - Value Stream != Organization
  - Value Stream realizes Stakeholder Value
  - Value Stream contains Value Stages
  - Value Stage is not inherently a Process
  - Value Stream identity is implementation-independent
  - Agentic behavior is not required for Value Stream identity
  - Autonomy is not required for Value Stream identity

  Agentic Value Stream + Autonomous Value Stream remain explicitly excluded
  (CR-ES-003 §3 Out of Scope). Their semantic establishment is sequenced for
  ADR-ES-005 per CR-ES-003 §39 follow-on sequence.

  Per ADR-ES-003 §30, the consequences of this release include:

  - Establishing a stable end-to-end value realization lens for enterprise
    architecture.
  - Separating value progression from execution (Process, Workflow, etc.).
  - Providing a semantic parent for the future Agentic Value Stream.
  - Enabling comparison of human-led, automated, and (future) agentic
    execution models against the same Value Stream reference.

  Per ADR-ES-003 §30, this release does NOT establish:

  - Agentic Value Stream (gated on ADR-ES-005, per CR-ES-003 §39 sequence).
  - Autonomous Value Stream (gated on a separate ADR).
  - Mature Value Stream catalogs (held for catalog population tranche).
