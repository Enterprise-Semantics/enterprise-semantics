cardinal_rules:
  - "Agentic Culture is a specialization of Culture (canonical per ADR-ES-026 + CR-ES-026 Accepted)"
  - "Agentic Culture is orthogonal to Autonomous Culture per ADR-ES-022 section 5"
  - "Agentic Culture is NOT Agentic Organization per ADR-ES-023 section 8"
  - "Agentic Culture is NOT Agentic Enterprise per ADR-ES-023 section 9"
  - "Agentic Culture is NOT AI Culture per ADR-ES-023 section 4"
  - "Agentic Culture is NOT Autonomous Culture per ADR-ES-023 section 10 + ADR-ES-022 section 5"
  - "AI NOT required per ADR-ES-023 section 12"
  - "Automation NOT sufficient per ADR-ES-023 section 12"
