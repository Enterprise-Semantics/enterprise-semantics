# versions/v1.7.0.yaml ;; Agentic Offering Semantic Grounding
#
# v1.7.0 release pointer ;; Enterprise-Semantics Programme
#
# Authoring CR: CR-ES-018 (Agentic Offering Semantic Grounding)
# Ratifying ADR: ADR-ES-018 (Agentic Offering Semantic Grounding)
#
# Release scope (per CR-ES-018 §21 + ADR-ES-018 §19):
#   - Foundational Offering dependency documented (per ADR-ES-018 §16 + CR-ES-018 §2)
#   - Canonical schema validation passes
#   - Registry validation passes
#   - Relationship validation passes
#   - Specialization validation passes
#   - Material agentic validation passes (CR-ES-018 §13)
#   - AI/automation independence tests pass (CR-ES-018 §14)
#   - Agentic/Autonomous orthogonality tests pass (CR-ES-018 §6)
#   - Provenance validation passes (CR-ES-018 §19)
#   - Mappings validate (CR-ES-018 §18)
#   - Documentation and diagrams are synchronized (CR-ES-018 §15)
#   - Positive conformance tests pass (AOFF-CON-001 .. AOFF-CON-020)
#   - Negative conformance tests pass (AOFF-NEG-001 .. AOFF-NEG-015)
#   - No unauthorized foundational concepts are introduced
#
# Release authority chain:
#   - ADR-ES-018 (Semantic Specialization Decision, Proposed, slot 0020)
#   - CR-ES-018 (Implementation Specification, Proposed, slot 0026)
#
# Foundational Dependency Gate status (per ADR-ES-018 §16 + CR-ES-018 §2):
#   As of 2026-09-25, the parent Offering concept is NOT yet canonical
#   in Enterprise-Semantics. Per user directive message
#   1552900782440058902 ("Proceed with 18"), this tranche implements
#   ES-018 with the dependency documented rather than blocked. The
#   next-foundational tranche is ADR-ES-019 (Offering canonical
#   grounding).
#
# Architectural continuity (per ADR-ES-018 §22):
#   Capability
#     |-- Agentic Capability
#     |-- Autonomous Capability
#   Product
#     |-- Agentic Product
#     |-- Autonomous Product
#   Service
#     |-- Agentic Service
#     |-- Autonomous Service
#   Offering
#     |-- Agentic Offering                  v1.7.0 (this release)
#     |-- [Autonomous Offering -- future]
#   Value Stream
#     |-- Agentic Value Stream
#     |-- Autonomous Value Stream
#   Enterprise
#     |-- Agentic Enterprise
#     |-- Autonomous Enterprise
#
# Prior releases in the v1.x line:
#   v1.1.0 -- Agentic Capability Semantic Grounding (CR-ES-012)
#   v1.2.0 -- Autonomous Capability Semantic Grounding (CR-ES-013)
#   v1.3.0 -- Agentic Service Semantic Grounding (CR-ES-014)
#   v1.4.0 -- Autonomous Service Semantic Grounding (CR-ES-015)
#   v1.5.0 -- Agentic Product Semantic Grounding (CR-ES-016)
#   v1.6.0 -- Autonomous Product Semantic Grounding (CR-ES-017)
#   v1.7.0 -- Agentic Offering Semantic Grounding (CR-ES-018) ; this release
#
# Boundaries preserved:
#   Agentic Offering != Agent
#   Agentic Offering != Agentic Product
#   Agentic Offering != Agentic Service
#   Agentic Offering != Agentic Workflow
#   Agentic Offering != Agentic Operations
#   Agentic Offering != Agentic Value Stream
#   Agentic Offering != Agentic Enterprise
#   Agentic Offering != AI Offering
#   Agentic Offering != Automated Offering
#
# Deferred concepts (per ADR-ES-018 §14 + CR-ES-018 §2):
#   Autonomous Offering
#   Autonomous Portfolio
#   Autonomous Agent
#   Autonomous Product Agent
#   Autonomous Ecosystem
#   Autonomous Enterprise beyond ADR-ES-011
#   Foundational Offering ontology (held for ADR-ES-019)
#
# Authored by: Emmanuel A. Otchere (cardinal author rule, 2026-09-24)

