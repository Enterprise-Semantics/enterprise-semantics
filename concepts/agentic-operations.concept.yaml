# concepts/agentic-operations.concept.yaml ;; Agentic Operations (ES:CONCEPT:agentic-operations) ;; per CR-ES-007 §6 + ADR-ES-007 §2
#
# Per CR-ES-007 §2 + §6 + ADR-ES-007 §2:
#   Agentic Operations are operations in which operational sensing ;;;
#   interpretation ;;; decision ;;; coordination ;;; adaptation ;;; or
#   execution is materially performed through agentic behavior within
#   defined intent ;;; authority ;;; and policy boundaries.
#
# This record supersedes the prior Profile hypothesis (FND-ES-AG-004 +
# ADR-ES-AG-001 §3.3) with the specialisation hypothesis established
# by CR-ES-007 + ADR-ES-007. The canonical identity
# ES:CONCEPT:agentic-operations is preserved ;; the hypothesis is
# updated.
#
# Authored by: Emmanuel A. Otchere (cardinal author rule, 2026-09-23)

id: ES:CONCEPT:agentic-operations
canonical_name: Agentic Operations
status: Candidate
version: 0.6.0
concept_type: agentic-operations

definition: |
  Agentic Operations are operations in which operational sensing ;;;
  interpretation ;;; decision ;;; coordination ;;; adaptation ;;; or
  execution is materially performed through agentic behavior within
  defined intent ;;; authority ;;; and policy boundaries.

# Per CR-ES-007 §3 + ADR-ES-007 §2:
#   Agentic Operations specializes Operations.

specializes:
  - ES:CONCEPT:operations

# Per ADR-ES-007 §21 + CR-ES-007 §8: 9 canonical relationships

relationships:
  - subject: ES:CONCEPT:agentic-operations
    predicate: specializes
    object: ES:CONCEPT:operations
    qualification: direct-specialisation
    status: established
    provenance: CR-ES-007 §3 + ADR-ES-007 §2 + §21
    rationale: |
      Agentic Operations is a direct specialisation of Operations ;; per
      the canonical relationship established by ADR-ES-007 §2 + §30.

  - subject: ES:CONCEPT:agentic-operations
    predicate: engages
    object: ES:CONCEPT:agent
    qualification: multi-agent-engagement
    status: established
    provenance: ADR-ES-007 §11 + §21 + CR-ES-007 §8.2
    rationale: |
      Agentic Operations may engage multiple Agents. Per ADR-ES-007
      §11 + CR-ES-007 §8.2. Agent semantics are inherited from
      CR-ES-004 + ADR-ES-004 ;; this relationship does not redefine
      Agent.

  - subject: ES:CONCEPT:agentic-operations
    predicate: responds-to
    object: external:concept:operational-context
    qualification: operational-context-response
    status: established
    provenance: ADR-ES-007 §21 + CR-ES-007 §8.3
    rationale: |
      Agentic Operations responds to Operational Context. Per
      ADR-ES-007 §16 (Operational Decision Boundary) + CR-ES-007
      §8.3. Operational Context is a forward-reference ;; not yet
      canonicalised as an Enterprise-Semantics concept.

  - subject: ES:CONCEPT:agentic-operations
    predicate: operates-within
    object: ES:CONCEPT:authority
    qualification: bounded-authority
    status: established
    provenance: ADR-ES-007 §21 + CR-ES-007 §8.4
    rationale: |
      Agentic Operations operates within defined Authority. Per
      ADR-ES-007 §6.7 (Bounded Authority). Authority semantics are
      inherited from CR-ES-004 + ADR-ES-004.

  - subject: ES:CONCEPT:agentic-operations
    predicate: governed-by
    object: external:concept:policy
    qualification: policy-governance
    status: established
    provenance: ADR-ES-007 §21 + CR-ES-007 §8.5
    rationale: |
      Agentic Operations is governed by applicable policies. Per
      ADR-ES-007 §6.7 + CR-ES-007 §8.5. Policy is a
      forward-reference ;; not yet canonicalised as an
      Enterprise-Semantics concept.

  - subject: ES:CONCEPT:agentic-operations
    predicate: coordinates
    object: external:concept:process
    qualification: process-coordination
    status: established
    provenance: ADR-ES-007 §10 + §21 + CR-ES-007 §8.6
    rationale: |
      Agentic Operations may coordinate one or more Processes. Per
      ADR-ES-007 §10 (Relationship to Process). Process is a
      forward-reference.

  - subject: ES:CONCEPT:agentic-operations
    predicate: uses
    object: ES:CONCEPT:agentic-workflow
    qualification: workflow-usage
    status: established
    provenance: ADR-ES-007 §9 + §21 + CR-ES-007 §8.7
    rationale: |
      Agentic Operations may use Agentic Workflows. Per ADR-ES-007 §9
      (Relationship to Agentic Workflow). Agentic Workflow semantics
      are inherited from CR-ES-006 + ADR-ES-006. This relationship
      does NOT imply Agentic Operations is-a Agentic Workflow.

  - subject: ES:CONCEPT:agentic-operations
    predicate: produces
    object: external:concept:operational-outcome
    qualification: outcome-production
    status: established
    provenance: ADR-ES-007 §18 + §21 + CR-ES-007 §8.8
    rationale: |
      Agentic Operations produces the Operational Outcome. Per
      ADR-ES-007 §18 (Operational Outcome). Operational Outcome is a
      forward-reference.

  - subject: ES:CONCEPT:agentic-operations
    predicate: adapts-to
    object: external:concept:operational-context
    qualification: contextual-adaptation
    status: established
    provenance: ADR-ES-007 §21 + CR-ES-007 §8.3
    rationale: |
      Agentic Operations adapts to Operational Context. Per
      ADR-ES-007 §6.5 (Adaptive Execution). Operational Context is
      a forward-reference.

# Per ADR-ES-007 §22 + CR-ES-007 §7: 10 properties

properties:
  - name: operational_intent
    type: reference
    required: true
    description: |
      Intent that guides the operation. Per ADR-ES-007 §22 + CR-ES-007
      §7. Operational intent is the semantic anchor for Agentic
      Operations.

  - name: operational_scope
    type: reference_set
    required: true
    description: |
      Boundary of the operation. Per ADR-ES-007 §22 + CR-ES-007 §7.
      Operational scope identifies the operational domain being
      managed.

  - name: agentic_scope
    type: reference_set
    required: true
    description: |
      Operational areas involving agentic behavior. Per ADR-ES-007 §22
      + CR-ES-007 §7. Distinguishes Agentic Operations from mere
      Operations containing Agents.

  - name: authority_context
    type: reference
    required: true
    description: |
      Authority under which decisions occur. Per ADR-ES-007 §22 +
      CR-ES-007 §7. Inherited Authority semantics from CR-ES-004.

  - name: policy_context
    type: reference
    required: true
    description: |
      Policies and constraints governing operation. Per ADR-ES-007 §22
      + CR-ES-007 §7. Policy is a forward-reference ;; documented
      rather than canonicalised here.

  - name: decision_boundary
    type: reference_set
    required: false
    description: |
      Decisions that may be performed agentically. Per ADR-ES-007 §22
      + CR-ES-007 §7 + §16.

  - name: adaptation_scope
    type: reference_set
    required: false
    description: |
      Areas in which operational adaptation is permitted. Per
      ADR-ES-007 §22 + CR-ES-007 §7. Distinguishes runtime
      adaptation from permanent modification.

  - name: intervention_model
    type: enumeration
    required: false
    values:
      - human-in-the-loop
      - human-on-the-loop
      - human-over-the-loop
      - mixed
    description: |
      Human intervention and oversight model. Per ADR-ES-007 §22 +
      CR-ES-007 §12. Human participation remains semantically valid.

  - name: observation_scope
    type: reference_set
    required: false
    description: |
      Operational state and outcomes observed. Per ADR-ES-007 §22 +
      CR-ES-007 §7 + §17 (Operational Control Loop).

  - name: escalation_boundary
    type: reference_set
    required: false
    description: |
      Conditions requiring intervention. Per ADR-ES-007 §22 + CR-ES-007
      §7 + §6.8 (Escalation).

# Per ADR-ES-007 §6: 8 characteristics

characteristics:
  - operational_sensing ;; per ADR-ES-007 §6.1
  - contextual_interpretation ;; per ADR-ES-007 §6.2
  - dynamic_decision ;; per ADR-ES-007 §6.3
  - agentic_coordination ;; per ADR-ES-007 §6.4
  - adaptive_execution ;; per ADR-ES-007 §6.5
  - continuous_observation ;; per ADR-ES-007 §6.6
  - bounded_authority ;; per ADR-ES-007 §6.7
  - escalation ;; per ADR-ES-007 §6.8

# Per ADR-ES-007 §28 + CR-ES-007 §24: semantic invariants

invariants:
  - AOP-INV-001 ;; Agentic Operations != Operations merely containing an Agent ;; per ADR-ES-007 §28.6 ;; material-participation criterion
  - AOP-INV-002 ;; Agentic Operations != Agentic Workflow ;; per ADR-ES-007 §7 + AOP-CON-013
  - AOP-INV-003 ;; Agentic Operations != Agentic Value Stream ;; per ADR-ES-007 §8 + AOP-CON-014
  - AOP-INV-004 ;; Agentic Operations != Process ;; per ADR-ES-007 §10 + AOP-CON-013 (negative test)
  - AOP-INV-005 ;; Agentic Operations != Autonomous Operations ;; per ADR-ES-007 §15 + AOP-CON-012
  - AOP-INV-006 ;; Agentic Operations does not require AI ;; per ADR-ES-007 §14 + AOP-CON-011
  - AOP-INV-007 ;; Agentic Operations does not conflate Automation with agency ;; per ADR-ES-007 §13 + §28.2
  - AOP-INV-008 ;; Agentic Operations does not establish Agentic Enterprise ;; per ADR-ES-007 §31

# Per CR-ES-007 §17 + §18 + ADR-ES-007 §16: 2 mapping files

mappings:
  - authority: wsf
    target_id: external:wsf:Operations
    relationship: specialization
    note: |
      Agentic Operations is a Tier 2 Specialisation of WSF Operations ;;;
      via the Operations grounding. Per CR-ES-007 §17 + ADR-ES-007 §16.
      No new WSF foundational Agentic Operations concept is asserted.
    file: enterprise-semantics-mappings/mappings/wsf/agentic-operations.yaml

  - authority: opendea
    target_id: external:opendea:Operations
    relationship: specialization
    note: |
      Agentic Operations is an OpenDEA Operations operating-mode
      specialisation ;; per CR-ES-007 §18 + ADR-ES-007 §16. No
      OpenDEA metamodel modification is required.
    file: enterprise-semantics-mappings/mappings/opendea/agentic-operations.yaml

# Cardinal rules

cardinal_rules:
  - author: Emmanuel A. Otchere
  - d004_dash_rule: 0 forbidden glyphs
  - vendor_specific_embargo: 0 references ;; no vendor-specific material from embargoed sources
  - naming: lowercase kebab-case per ADR-ES-002 §11 ;; canonical_name stays un-prefixed ;; id form is ES:CONCEPT:agentic-operations

# Provenance chain

governance: enterprise-semantics
provenance:
  - source: CR-ES-007 §6
    note: Canonical schema ;; this record is the canonical implementation.
  - source: ADR-ES-007 §2 + §21
    note: Architectural decision ;; canonical relationships.
  - source: FND-ES-AG-004
    note: |
      Original Profile hypothesis ;; superseded by this CR-ES-007
      record. The canonical identity ES:CONCEPT:agentic-operations is
      preserved ;; the hypothesis is updated to specialisation.
  - source: ADR-ES-AG-001
    note: Profile pattern generalised ;;; superseded by ADR-ES-007.
  - source: ADR-ES-006 §36
    note: "Next Decision Candidates ;;; ADR-ES-007 chosen as natural follow-on."
  - source: FND-ES-AG-008 §1.3
    note: "Tier 1 / Tier 2 grounding classification ;;; Agentic Operations is Tier 2 Specialisation."
  - source: https://github.com/World-Semantic-Foundation
    note: WSF Activity grounding inherited via Operations.